<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENGELIX</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENGELIX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#222}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
h2{margin:0;font-size:18px;color:#222}
.pc{display:none}

/* LOGIN */
#tela-login{min-height:100dvh;background:#1f3a5f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.logo-login{width:220px;height:auto;display:block}
.caixa{width:100%;max-width:360px;background:#fff;border-radius:8px;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.caixa h1{margin:0;font-size:20px;color:#1f3a5f;text-align:center}
.rotulo{font-size:13px;color:#4f5d6b}
.nomes{display:flex;flex-direction:column;gap:8px}
.grupo-t{font-size:12px;font-weight:bold;color:#1f3a5f;margin:6px 0 0}
.vazio{font-size:14px;color:#4f5d6b;text-align:center;padding:16px 0;grid-column:1 / -1}
.nome{min-height:44px;border-radius:6px;border:1px solid #c4ccd6;background:#fff;color:#222;font-size:15px;text-align:left;padding:0 14px}
.nome.sel{border:2px solid #1f3a5f;background:#e8edf3;color:#1f3a5f;font-weight:bold}
.dica{margin:6px 0 0;font-size:12px;color:#1f3a5f;min-height:16px}
.sep{display:flex;align-items:center;gap:10px;font-size:12px;color:#4f5d6b;margin-top:2px}
.sep:before,.sep:after{content:'';flex:1;height:1px;background:#c4ccd6}
.clientes{display:flex;gap:8px}
.clientes .nome{flex:1;text-align:center;padding:0 8px;font-size:14px}
.campo{display:flex;align-items:center;border:1px solid #c4ccd6;border-radius:6px;min-height:44px;padding:0 6px 0 14px;gap:8px}
.campo input{flex:1;min-width:0;border:0;outline:0;font-size:16px;background:transparent;color:#222}
.olho{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.entrar{min-height:48px;border-radius:6px;border:0;background:#1f3a5f;color:#fff;font-size:16px;font-weight:bold}
.nota{margin:0;font-size:12px;color:#4f5d6b;text-align:center;line-height:1.4}
.erro{margin:0;font-size:13px;color:#b03a2e;text-align:center}
.exemplo{font-size:12px;font-weight:normal;color:#6b4700}

/* APP (CELULAR) */
#tela-app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.topo{background:#1f3a5f;padding:calc(16px + env(safe-area-inset-top)) 20px 18px;border-radius:0 0 20px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.troca{order:10;flex:0 0 100%;display:flex;background:rgba(255,255,255,.14);border-radius:12px;padding:4px;gap:4px;margin-top:4px}
.troca button{flex:1;min-height:40px;border-radius:9px;border:0;font-size:14px;font-weight:bold;background:transparent;color:#fff}
.troca button.on{background:#fff;color:#1f3a5f}
.topo .folha{width:44px;height:36px;object-fit:contain;display:block}
.saud{flex:1;min-width:0;display:flex;flex-direction:column}
.saud small{font-size:13px;color:#d3deeb}
.saud strong{font-size:20px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sino{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#b03a2e;color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 4px}
.corpo{flex:1;min-height:0;overflow:auto;padding:22px 20px 16px}
.painel{display:flex;flex-direction:column;gap:22px;max-width:520px;margin:0 auto}
.grade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 0}
.sis{grid-column:var(--c);display:flex;flex-direction:column;align-items:center;gap:8px;color:#222;font-size:13px;text-align:center;line-height:1.25;background:none;border:0;padding:0}
.sis .ic{width:80px;height:80px;border-radius:22px;background:#fff;border:2px solid #1f3a5f;display:flex;align-items:center;justify-content:center}
.sis .desc{display:none}
.cartao{background:#fff;border:1px solid #c4ccd6;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.cartao-t{font-size:15px;font-weight:bold;color:#1f3a5f}
.filtro{display:flex;background:#e8edf3;border-radius:10px;padding:3px;gap:3px}
.filtro button{flex:1;min-height:44px;border-radius:8px;border:0;font-size:13px;font-weight:bold;background:transparent;color:#1f3a5f}
.filtro button.on{background:#1f3a5f;color:#fff}
.tarefa{display:flex;align-items:center;gap:10px;border-top:1px solid #e1e6ec;padding-top:10px}
.tarefa .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tarefa .t span:first-child{font-size:14px;line-height:1.3}
.tarefa .t span:last-child{font-size:12px;color:#4f5d6b}
.etq{flex:none;font-size:11px;font-weight:bold;border-radius:10px;padding:4px 9px}
.etq.resp{background:#1f3a5f;color:#fff}
.etq.apoio{background:#e8edf3;color:#1f3a5f}
.avatar{width:72px;height:72px;border-radius:36px;background:#1f3a5f;color:#fff;font-size:30px;font-weight:bold;display:flex;align-items:center;justify-content:center;margin:0 auto}
.perfil{align-items:center;text-align:center}
.sair{min-height:48px;border-radius:6px;border:2px solid #1f3a5f;background:#fff;color:#1f3a5f;font-size:16px;font-weight:bold;width:100%}
nav.abas{background:#fff;border-top:1px solid #c4ccd6;display:flex;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
nav.abas button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:#4f5d6b;font-size:12px}
nav.abas button.on{color:#1f3a5f;font-weight:bold}
#aviso{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f3a5f;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;text-align:center}
#folha-notif{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
#folha-notif .conteudo{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
.ni{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #e1e6ec;padding-top:8px;margin-top:8px}
.ni i{flex:none;width:8px;height:8px;border-radius:4px;background:#b03a2e;margin-top:6px}
.ni div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ni div span:first-child{font-size:14px;line-height:1.3;color:#222}
.ni div span:last-child{font-size:12px;color:#4f5d6b}

/* PC (TELA LARGA) */
@media (min-width:900px){
  .cel{display:none!important}
  .titulo-pc{display:inline}
  .topo{border-radius:0;min-height:72px;padding:0 32px;gap:24px;flex-wrap:nowrap;justify-content:space-between}
  .logo-pc{order:1}
  .troca{order:2;flex:0 0 320px;margin-top:0}
  .usr-pc{order:3}
  .logo-pc{display:block;height:42px;width:auto}
  .usr-pc{display:flex;align-items:center;gap:16px;color:#fff;font-size:15px}
  .usr-pc button{background:none;border:0;color:#d3deeb;font-size:15px;text-decoration:underline;padding:6px 0}
  nav.abas{display:none}
  .corpo{padding:28px 32px 32px}
  #painel-tarefas,#painel-perfil{display:none!important}
  #painel-inicio{display:grid!important;max-width:1240px;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto 212px auto;gap:16px 32px;align-items:stretch}
  #painel-inicio>h2{grid-column:1 / -1;grid-row:1;font-size:20px;color:#1f3a5f}
  .grade{grid-column:1;grid-row:2;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;min-width:0}
  .sis{grid-column:var(--cp);width:100%;height:100%;background:#fff;border:1px solid #c4ccd6;border-radius:14px;padding:16px 14px;gap:8px;overflow:hidden}
  .sis .ic{width:72px;height:72px;border-radius:20px}
  .sis .ic svg{width:44px;height:44px}
  .sis .nm{font-size:15px;font-weight:bold;color:#1f3a5f;line-height:1.25}
  .sis .desc{display:block;font-size:12px;color:#4f5d6b;line-height:1.35}
  .caixa-notif{display:flex;grid-column:2;grid-row:2;flex-direction:column;overflow:auto;background:#fff;border:1px solid #c4ccd6;border-radius:14px;padding:12px 18px}
  .caixa-notif .nh{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:bold;color:#1f3a5f}
  .caixa-notif .nb{min-width:22px;height:22px;border-radius:11px;background:#b03a2e;color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .cartao{grid-column:1 / -1;grid-row:3;padding:16px 18px}
  .cartao .filtro{max-width:360px}
}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<section id="tela-login" hidden>
  <img class="logo-login" src="logo-branco.png" alt="ENGELIX">
  <form class="caixa" id="form-login" autocomplete="off">
    <h1>Portal ENGELIX</h1>
    <div id="bloco-usuario">
      <label class="rotulo" for="usuario" style="display:block;margin-bottom:6px">Usuário</label>
      <div class="campo">
        <input id="usuario" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">
      </div>
      <p class="dica" id="dica"></p>
    </div>
    <div id="bloco-cliente-sel" hidden>
      <div class="rotulo">Entrando como cliente:</div>
      <div style="font-size:16px;font-weight:bold;color:#1f3a5f;margin-top:4px" id="cliente-nome"></div>
    </div>
    <div id="bloco-senha">
      <label class="rotulo" for="senha" style="display:block;margin-bottom:6px">Senha</label>
      <div class="campo">
        <input id="senha" type="password" autocomplete="current-password">
        <button type="button" class="olho" id="olho" aria-label="Mostrar senha">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4f5d6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <p class="erro" id="erro" hidden></p>
    <button class="entrar" type="submit" id="btn-entrar">Entrar</button>
    <div class="sep" id="sep-cliente" hidden>Sou cliente</div>
    <div class="clientes" id="clientes" hidden></div>
    <p class="nota">Você fica conectado neste aparelho até tocar em "Sair".</p>
  </form>
</section>

<!-- APP -->
<section id="tela-app" hidden>
  <header class="topo">
    <img class="folha cel" src="folha-branca.png" alt="ENGELIX">
    <div class="saud cel"><small id="saudacao">Olá,</small><strong id="nome-topo"></strong></div>
    <button class="sino cel" id="sino" type="button" aria-label="Notificações">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge" id="badge-cel">3</span>
    </button>
    <img class="logo-pc pc" src="logo-branco.png" alt="ENGELIX">
    <div class="usr-pc pc">
      <span id="nome-pc"></span>
      <button type="button" id="alterar-senha">alterar senha</button>
      <button type="button" id="sair-pc">sair</button>
    </div>
    <div class="troca" id="troca" hidden></div>
  </header>

  <main class="corpo" id="corpo">
    <div class="painel" id="painel-inicio">
      <h2><span class="cel">Sistemas</span><span class="pc titulo-pc" id="titulo-pc">ENGELIX</span></h2>
      <div class="grade" id="grade"></div>
      <section class="caixa-notif pc">
        <div class="nh"><span>Notificações <span class="exemplo">(exemplos)</span></span><span class="nb" id="badge-pc">3</span></div>
        <div id="lista-notif-pc"></div>
      </section>
      <div class="cartao">
        <div class="cartao-t">Minhas tarefas <span class="exemplo">(exemplos)</span></div>
        <div class="filtro" data-filtro></div>
        <div id="lista-inicio"></div>
      </div>
    </div>

    <div class="painel" id="painel-tarefas" hidden>
      <h2>Minhas tarefas <span class="exemplo">(exemplos)</span></h2>
      <div class="filtro" data-filtro></div>
      <div class="cartao"><div id="lista-tarefas"></div></div>
    </div>

    <div class="painel perfil" id="painel-perfil" hidden>
      <div class="avatar" id="avatar"></div>
      <h2 id="nome-perfil"></h2>
      <button class="sair" id="sair" type="button">Sair</button>
    </div>
  </main>

  <nav class="abas">
    <button type="button" data-aba="inicio" class="on">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      Início
    </button>
    <button type="button" data-aba="tarefas">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Tarefas
    </button>
    <button type="button" data-aba="perfil">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Perfil
    </button>
  </nav>
</section>

<div id="folha-notif" hidden>
  <div class="conteudo">
    <h2>Notificações <span class="exemplo">(exemplos)</span></h2>
    <div id="lista-notif-cel"></div>
    <button class="sair" id="fechar-notif" type="button" style="margin-top:12px">Fechar</button>
  </div>
</div>

<div id="aviso" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var API = 'https://script.google.com/macros/s/AKfycbxF-7TOyL8YyNmawN-MW3crYqy5YALc3vVWW8mGkWTSOPGgigx4rhgdCM8IvOc_RqMT/exec';
  var CHAVE = 'engelix_sessao';      // { token, nome }
  var CHAVE_CACHE = 'engelix_cache'; // { usuario, secoes } (último que o servidor mandou)
  var CHAVE_EMP = 'engelix_empresa';

  var ICONES = {
    controle: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="m9 14 2 2 4-4"/>',
    memoriais: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/>',
    cargatermica: '<path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/>',
    email: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    diario: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    geral: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>'
  };

  var TAREFAS = [
    { t: 'Tarefa de exemplo 1', s: '[Projeto] · prazo [data]', papel: 'resp' },
    { t: 'Tarefa de exemplo 2', s: '[Projeto] · prazo [data]', papel: 'apoio' },
    { t: 'Tarefa de exemplo 3', s: '[Projeto] · prazo [data]', papel: 'resp' }
  ];

  var NOTIFS = [
    ['Tarefa atribuída a você', '[Projeto] · há 10 min'],
    ['Nova entrega registrada', '[Projeto] · há 1 h'],
    ['Notificação de exemplo', 'ontem']
  ];

  var FILTROS = [['todas', 'Todas'], ['resp', 'Responsável'], ['apoio', 'Apoio']];
  var filtro = 'todas';
  var tempoAviso = null;
  var TOKEN = '';
  var SECOES = [];
  var empresaSel = '';

  function $(id) { return document.getElementById(id); }

  function lerJson(chave) {
    try { return JSON.parse(localStorage.getItem(chave)); } catch (e) { return null; }
  }
  function gravarJson(chave, valor) {
    try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) {}
  }
  function apagar(chave) {
    try { localStorage.removeItem(chave); } catch (e) {}
  }

  function avisar(msg) {
    var el = $('aviso');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(tempoAviso);
    tempoAviso = setTimeout(function () { el.hidden = true; }, 2800);
  }

  /* ---------- COMUNICAÇÃO COM O SERVIDOR (Apps Script) ---------- */
  function api(corpo) {
    return fetch(API, { method: 'POST', body: JSON.stringify(corpo) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.erro || 'Erro inesperado.');
        return j.dados;
      }, function () {
        throw new Error('Sem conexão com o servidor. Tente de novo.');
      });
  }

  function aparelho() {
    var u = navigator.userAgent || '';
    return (/iPhone|iPad/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : 'Computador') + ' · app';
  }

  /* ---------- LOGIN ---------- */
  var listaNomes = [];     // equipe (quem digita o nome)
  var listaClientes = [];  // clientes (botões)
  var clienteSel = '';
  var promessaNomes = null;

  function mostrarErroLogin(msg) {
    $('erro').textContent = msg;
    $('erro').hidden = false;
  }

  function norm(t) {
    return String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  function acharNome(txt) {
    var alvo = norm(txt);
    if (!alvo) return '';
    for (var i = 0; i < listaNomes.length; i++) if (norm(listaNomes[i]) === alvo) return listaNomes[i];
    return '';
  }

  function atualizarDica() {
    var n = acharNome($('usuario').value);
    $('dica').textContent = n ? '✓ ' + n : '';
  }

  function corrigirCampo() {
    var n = acharNome($('usuario').value);
    if (n) $('usuario').value = n;
    atualizarDica();
  }

  function escolherCliente(n) {
    clienteSel = clienteSel === n ? '' : n;
    $('erro').hidden = true;
    $('bloco-usuario').hidden = !!clienteSel;
    $('bloco-cliente-sel').hidden = !clienteSel;
    $('cliente-nome').textContent = clienteSel;
    Array.prototype.forEach.call(document.querySelectorAll('#clientes .nome'), function (c) {
      c.classList.toggle('sel', c.textContent === clienteSel);
    });
    $('senha').value = '';
    $(clienteSel ? 'senha' : 'usuario').focus();
  }

  function montarNomes(dados) {
    var vistos = {}, clientes = dados.clientes || [];
    listaNomes = [];
    (dados.grupos || []).forEach(function (g) {
      g.nomes.forEach(function (n) {
        if (clientes.indexOf(n) < 0 && !vistos[n]) { vistos[n] = true; listaNomes.push(n); }
      });
    });
    listaClientes = clientes;
    var box = $('clientes');
    box.innerHTML = '';
    clientes.forEach(function (n) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'nome';
      b.textContent = n;
      b.addEventListener('click', function () { escolherCliente(n); });
      box.appendChild(b);
    });
    box.hidden = !clientes.length;
    $('sep-cliente').hidden = !clientes.length;
    corrigirCampo();
  }

  function carregarNomes() {
    promessaNomes = api({ acao: 'nomes' }).then(montarNomes).catch(function (e) {
      promessaNomes = null;
      throw e;
    });
    promessaNomes.catch(function () {});
    return promessaNomes;
  }

  function mostrarLogin(msg) {
    clienteSel = '';
    $('usuario').value = '';
    $('dica').textContent = '';
    $('bloco-usuario').hidden = false;
    $('bloco-cliente-sel').hidden = true;
    $('senha').value = '';
    $('senha').type = 'password';
    $('erro').hidden = true;
    if (msg) mostrarErroLogin(msg);
    $('tela-app').hidden = true;
    $('tela-login').hidden = false;
    carregarNomes();
  }

  $('usuario').addEventListener('input', atualizarDica);
  $('usuario').addEventListener('blur', corrigirCampo);

  $('form-login').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('btn-entrar');
    if (btn.disabled) return;
    $('erro').hidden = true;
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    var pronto = promessaNomes || carregarNomes();
    pronto.then(function () {
      var nome = clienteSel || acharNome($('usuario').value);
      if (!nome) throw new Error($('usuario').value.trim() ? 'Usuário não encontrado.' : 'Digite seu usuário.');
      if (!clienteSel) $('usuario').value = nome;
      return api({ acao: 'entrar', nome: nome, senha: $('senha').value, aparelho: aparelho() });
    }).then(function (d) {
      TOKEN = d.token;
      gravarJson(CHAVE, { token: d.token, nome: d.usuario.nome });
      gravarJson(CHAVE_CACHE, { usuario: d.usuario, secoes: d.secoes });
      mostrarApp(d, false);
    }).catch(function (err) { mostrarErroLogin(err.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'Entrar'; });
  });

  $('olho').addEventListener('click', function () {
    var c = $('senha');
    c.type = c.type === 'password' ? 'text' : 'password';
    this.setAttribute('aria-label', c.type === 'password' ? 'Mostrar senha' : 'Ocultar senha');
  });

  /* ---------- SISTEMAS (grade sem espaço vazio) ---------- */
  function colunasCel(n) {
    var c = [], i;
    if (n === 1) return ['span 6'];
    if (n === 2) return ['span 3', 'span 3'];
    if (n === 3) return ['span 2', 'span 2', 'span 2'];
    if (n === 4) return ['span 3', 'span 3', 'span 3', 'span 3'];
    for (i = 0; i < n; i++) c.push('span 2');
    var resto = n % 3;
    if (resto === 1) c[n - 1] = '3 / span 2';
    if (resto === 2) c[n - 2] = '2 / span 2';
    return c;
  }

  function colunasPc(n) {
    var c = [], i;
    if (n <= 4) {
      for (i = 0; i < n; i++) c.push('span ' + (12 / n));
      return c;
    }
    for (i = 0; i < n; i++) c.push('span 4');
    var resto = n % 3;
    if (resto === 1) c[n - 1] = '5 / span 4';
    if (resto === 2) c[n - 2] = '3 / span 4';
    return c;
  }

  function secaoAtual() {
    return SECOES.filter(function (s) { return s.id === empresaSel; })[0] || SECOES[0] || null;
  }

  function abrirSistema(s) {
    if (s.emConstrucao) { avisar(s.nome + ' ainda está em construção.'); return; }
    if (s.externo) { window.open(s.link, '_blank'); return; }
    var w = window.open('', '_blank');
    avisar('Abrindo ' + s.nome + '…');
    api({ acao: 'abrir', token: TOKEN, id: s.id }).then(function (d) {
      if (w) { w.location.href = d.url; } else { location.href = d.url; }
    }).catch(function (e) {
      if (w) w.close();
      tratarErro(e);
    });
  }

  function montarGrade() {
    var g = $('grade');
    var sec = secaoAtual();
    var lista = sec ? sec.sistemas : [];
    g.innerHTML = '';
    $('titulo-pc').textContent = sec ? sec.nome : 'ENGELIX';
    if (!lista.length) {
      g.innerHTML = '<div class="vazio">Nenhum sistema disponível para você.</div>';
      return;
    }
    var col = colunasCel(lista.length);
    var colPc = colunasPc(lista.length);
    lista.forEach(function (s, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'sis';
      b.style.setProperty('--c', col[i]);
      b.style.setProperty('--cp', colPc[i]);
      b.innerHTML = '<span class="ic"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1f3a5f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONES[s.icone] || ICONES.geral) + '</svg></span>';
      var rot = document.createElement('span');
      rot.className = 'nm';
      rot.textContent = s.nome;
      b.appendChild(rot);
      var d = document.createElement('span');
      d.className = 'desc';
      d.textContent = s.descricao || '';
      b.appendChild(d);
      b.addEventListener('click', function () { abrirSistema(s); });
      g.appendChild(b);
    });
  }

  function montarTroca() {
    var box = $('troca');
    box.innerHTML = '';
    box.hidden = SECOES.length < 2;
    if (SECOES.length < 2) return;
    SECOES.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = s.nome.replace(/^ENGELIX\s+/i, '');
      b.className = s.id === empresaSel ? 'on' : '';
      b.addEventListener('click', function () {
        empresaSel = s.id;
        try { localStorage.setItem(CHAVE_EMP, s.id); } catch (e) {}
        montarTroca();
        montarGrade();
      });
      box.appendChild(b);
    });
  }

  /* ---------- NOTIFICAÇÕES ---------- */
  function desenharNotifs() {
    ['lista-notif-pc', 'lista-notif-cel'].forEach(function (id) {
      var box = $(id);
      box.innerHTML = '';
      NOTIFS.forEach(function (n) {
        var d = document.createElement('div');
        d.className = 'ni';
        var p = document.createElement('i');
        var t = document.createElement('div');
        var a = document.createElement('span'); a.textContent = n[0];
        var b = document.createElement('span'); b.textContent = n[1];
        t.appendChild(a); t.appendChild(b);
        d.appendChild(p); d.appendChild(t);
        box.appendChild(d);
      });
    });
    $('badge-cel').textContent = NOTIFS.length;
    $('badge-pc').textContent = NOTIFS.length;
  }

  /* ---------- TAREFAS ---------- */
  function montarFiltros() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-filtro]'), function (box) {
      box.innerHTML = '';
      FILTROS.forEach(function (f) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = f[1];
        b.className = f[0] === filtro ? 'on' : '';
        b.addEventListener('click', function () { filtro = f[0]; montarFiltros(); desenharTarefas(); });
        box.appendChild(b);
      });
    });
  }

  function desenharTarefas() {
    ['lista-inicio', 'lista-tarefas'].forEach(function (id) {
      var box = $(id);
      box.innerHTML = '';
      TAREFAS.filter(function (x) { return filtro === 'todas' || x.papel === filtro; })
        .forEach(function (x) {
          var d = document.createElement('div');
          d.className = 'tarefa';
          d.style.marginTop = '12px';
          var t = document.createElement('div');
          t.className = 't';
          var a = document.createElement('span'); a.textContent = x.t;
          var b = document.createElement('span'); b.textContent = x.s;
          t.appendChild(a); t.appendChild(b);
          var q = document.createElement('span');
          q.className = 'etq ' + x.papel;
          q.textContent = x.papel === 'resp' ? 'Responsável' : 'Apoio';
          d.appendChild(t); d.appendChild(q);
          box.appendChild(d);
        });
    });
  }

  /* ---------- ABAS (CELULAR) ---------- */
  function irPara(aba) {
    ['inicio', 'tarefas', 'perfil'].forEach(function (a) {
      $('painel-' + a).hidden = a !== aba;
    });
    Array.prototype.forEach.call(document.querySelectorAll('nav.abas button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-aba') === aba);
    });
    $('corpo').scrollTop = 0;
  }

  Array.prototype.forEach.call(document.querySelectorAll('nav.abas button'), function (b) {
    b.addEventListener('click', function () { irPara(b.getAttribute('data-aba')); });
  });

  /* ---------- APP ---------- */
  function saudacao() {
    var h = new Date().getHours();
    return h < 12 ? 'Bom dia,' : (h < 18 ? 'Boa tarde,' : 'Boa noite,');
  }

  function mostrarApp(dados, manterAba) {
    var nome = dados.usuario.nome;
    SECOES = dados.secoes || [];
    var guardada = '';
    try { guardada = localStorage.getItem(CHAVE_EMP) || ''; } catch (e) {}
    if (!SECOES.some(function (s) { return s.id === empresaSel; })) {
      empresaSel = SECOES.some(function (s) { return s.id === guardada; }) ? guardada : (SECOES[0] ? SECOES[0].id : '');
    }
    $('saudacao').textContent = saudacao();
    $('nome-topo').textContent = nome;
    $('nome-pc').textContent = nome;
    $('nome-perfil').textContent = nome;
    $('avatar').textContent = nome.charAt(0).toUpperCase();
    montarTroca();
    montarGrade();
    montarFiltros();
    desenharTarefas();
    desenharNotifs();
    if (!manterAba) irPara('inicio');
    $('tela-login').hidden = true;
    $('tela-app').hidden = false;
  }

  function sairLocal(msg) {
    TOKEN = '';
    apagar(CHAVE);
    apagar(CHAVE_CACHE);
    mostrarLogin(msg);
  }

  function sair() {
    var t = TOKEN;
    sairLocal();
    if (t) api({ acao: 'sair', token: t }).catch(function () {});
  }

  function tratarErro(e) {
    if (e && e.message === 'SESSAO_INVALIDA') { sairLocal('Sua sessão terminou. Entre novamente.'); return; }
    avisar(e && e.message ? e.message : 'Erro inesperado.');
  }

  $('sair').addEventListener('click', sair);
  $('sair-pc').addEventListener('click', sair);
  $('alterar-senha').addEventListener('click', function () {
    avisar('Em breve: alterar senha.');
  });

  $('sino').addEventListener('click', function () { $('folha-notif').hidden = false; });
  $('fechar-notif').addEventListener('click', function () { $('folha-notif').hidden = true; });
  $('folha-notif').addEventListener('click', function (e) {
    if (e.target === this) this.hidden = true;
  });

  /* ---------- INICIO ---------- */
  var sessao = lerJson(CHAVE);
  if (sessao && sessao.token) {
    TOKEN = sessao.token;
    var cache = lerJson(CHAVE_CACHE);
    if (cache && cache.usuario) mostrarApp(cache, false);   // abre na hora com o que já sabe
    api({ acao: 'sessao', token: TOKEN }).then(function (d) {
      gravarJson(CHAVE_CACHE, d);
      mostrarApp(d, true);
    }).catch(function (e) {
      if (e && e.message === 'SESSAO_INVALIDA') { sairLocal('Sua sessão terminou. Entre novamente.'); }
      else if (!(cache && cache.usuario)) { mostrarLogin(e.message); }
    });
  } else {
    mostrarLogin();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
