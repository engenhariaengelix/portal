<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENGELIX</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ENGELIX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#222}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
h2{margin:0;font-size:18px;color:#222}
.pc{display:none}

/* LOGIN */
#tela-login{min-height:100dvh;background:#1f3a5f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.logo-login{width:220px;height:auto;display:block}
.caixa{width:100%;max-width:360px;background:#fff;border-radius:8px;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.caixa h1{margin:0;font-size:20px;color:#1f3a5f;text-align:center}
.rotulo{font-size:13px;color:#4f5d6b}
.nomes{display:flex;flex-direction:column;gap:8px}
.grupo-t{font-size:12px;font-weight:bold;color:#1f3a5f;margin:6px 0 0}
.vazio{font-size:14px;color:#4f5d6b;text-align:center;padding:16px 0;grid-column:1 / -1}
.nome{min-height:44px;border-radius:6px;border:1px solid #c4ccd6;background:#fff;color:#222;font-size:15px;text-align:left;padding:0 14px}
.nome.sel{border:2px solid #1f3a5f;background:#e8edf3;color:#1f3a5f;font-weight:bold}
.dica{margin:6px 0 0;font-size:12px;color:#1f3a5f;min-height:16px}
.link-cliente{align-self:center;background:none;border:0;color:#1f3a5f;font-size:14px;text-decoration:underline;padding:8px 12px}
.campo{display:flex;align-items:center;border:1px solid #c4ccd6;border-radius:6px;min-height:44px;padding:0 6px 0 14px;gap:8px}
.campo input{flex:1;min-width:0;border:0;outline:0;font-size:16px;background:transparent;color:#222}
.olho{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.entrar{min-height:48px;border-radius:6px;border:0;background:#1f3a5f;color:#fff;font-size:16px;font-weight:bold}
.nota{margin:0;font-size:12px;color:#4f5d6b;text-align:center;line-height:1.4}
.erro{margin:0;font-size:13px;color:#b03a2e;text-align:center}
.exemplo{font-size:12px;font-weight:normal;color:#6b4700}

/* APP (CELULAR) */
#tela-app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;overflow:hidden}
.topo{background:#1f3a5f;padding:calc(16px + env(safe-area-inset-top)) 20px 18px;border-radius:0 0 20px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.troca{order:10;flex:0 0 100%;display:flex;background:rgba(255,255,255,.14);border-radius:12px;padding:4px;gap:4px;margin-top:4px}
.troca button{flex:1;min-height:40px;border-radius:9px;border:0;font-size:14px;font-weight:bold;background:transparent;color:#fff}
.troca button.on{background:#fff;color:#1f3a5f}
.topo .folha{width:44px;height:36px;object-fit:contain;display:block}
.saud{flex:1;min-width:0;display:flex;flex-direction:column}
.saud small{font-size:13px;color:#d3deeb}
.saud strong{font-size:20px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sino{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#b03a2e;color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 4px}
.corpo{flex:1;min-height:0;overflow:auto;padding:22px 20px 16px}
.painel{display:flex;flex-direction:column;gap:22px;max-width:520px;margin:0 auto}
.grade{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 0}
.sis{grid-column:var(--c);display:flex;flex-direction:column;align-items:center;gap:8px;color:#222;font-size:13px;text-align:center;line-height:1.25;background:none;border:0;padding:0}
.sis .ic{width:80px;height:80px;border-radius:22px;background:#fff;border:2px solid #1f3a5f;display:flex;align-items:center;justify-content:center}
.sis .desc{display:none}
.cartao{background:#fff;border:1px solid #c4ccd6;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.cartao-t{font-size:15px;font-weight:bold;color:#1f3a5f}
.filtro{display:flex;background:#e8edf3;border-radius:10px;padding:3px;gap:3px}
.filtro button{flex:1;min-height:44px;border-radius:8px;border:0;font-size:13px;font-weight:bold;background:transparent;color:#1f3a5f}
.filtro button.on{background:#1f3a5f;color:#fff}
.tarefa{display:flex;align-items:center;gap:10px;border-top:1px solid #e1e6ec;padding-top:10px}
.tarefa .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tarefa .t span:first-child{font-size:14px;line-height:1.3}
.tarefa .t span:last-child{font-size:12px;color:#4f5d6b}
.etq{flex:none;font-size:11px;font-weight:bold;border-radius:10px;padding:4px 9px}
.etq.resp{background:#1f3a5f;color:#fff}
.etq.apoio{background:#e8edf3;color:#1f3a5f}
.avatar{width:72px;height:72px;border-radius:36px;background:#1f3a5f;color:#fff;font-size:30px;font-weight:bold;display:flex;align-items:center;justify-content:center;margin:0 auto}
.perfil{align-items:center;text-align:center}
.sair{min-height:48px;border-radius:6px;border:2px solid #1f3a5f;background:#fff;color:#1f3a5f;font-size:16px;font-weight:bold;width:100%}
nav.abas{background:#fff;border-top:1px solid #c4ccd6;display:flex;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
nav.abas button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:#4f5d6b;font-size:12px}
nav.abas button.on{color:#1f3a5f;font-weight:bold}
#aviso{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f3a5f;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;text-align:center}
#folha-notif{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
#folha-notif .conteudo{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
.nlink{align-self:flex-start;background:none;border:0;color:#1f3a5f;font-size:12px;text-decoration:underline;padding:4px 0;cursor:pointer}
.ni{display:flex;gap:10px;align-items:flex-start;border-top:1px solid #e1e6ec;padding-top:8px;margin-top:8px}
.ni i{flex:none;width:8px;height:8px;border-radius:4px;background:#b03a2e;margin-top:6px}
.ni div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ni div span:first-child{font-size:14px;line-height:1.3;color:#222}
.ni div span:last-child{font-size:12px;color:#4f5d6b}

/* TAREFAS REAIS (etapa 3) */
#lista-inicio{display:flex;flex-direction:column;gap:10px}
.obra-bt{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;background:#fff;border:2px solid #c4ccd6;border-radius:12px;padding:10px 14px;text-align:left;color:#222}
.obra-bt .o{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.obra-bt .o span:first-child{font-size:15px;font-weight:bold;color:#1f3a5f}
.obra-bt .o span:last-child{font-size:12px;color:#4f5d6b}
.obra-bt .seta{flex:none;font-size:24px;color:#1f3a5f}
.obra-t{font-size:15px;font-weight:bold;color:#1f3a5f;margin-top:18px;padding-bottom:4px;border-bottom:2px solid #1f3a5f}
.obra-t:first-child{margin-top:0}
.grupo-tf{font-size:12px;font-weight:bold;color:#4f5d6b;margin-top:10px;text-transform:uppercase}
button.tarefa{width:100%;background:none;border:0;border-top:1px solid #e1e6ec;padding:10px 0 0;margin-top:12px;text-align:left;font:inherit;color:inherit}
.filtros-campos{display:flex;flex-direction:column;gap:8px}
.filtros-campos select{width:100%;min-height:44px;border:1px solid #c4ccd6;border-radius:8px;background:#fff;color:#222;font-size:14px;padding:0 10px}
.limpar{align-self:flex-start;background:none;border:0;color:#1f3a5f;font-size:14px;text-decoration:underline;padding:8px 0}
#folha-tarefa{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
#folha-tarefa .conteudo{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;max-height:85dvh;overflow:auto}
.det{display:flex;flex-direction:column;gap:2px;border-top:1px solid #e1e6ec;padding-top:8px;margin-top:8px}
.det small{font-size:12px;color:#4f5d6b}
.det span{font-size:15px;color:#222;line-height:1.35;white-space:pre-wrap}
.det select,.det textarea,.det input{font:inherit;font-size:15px;padding:8px 10px;border:1px solid #c4ccd6;border-radius:8px;background:#fff;color:#222;width:100%;box-sizing:border-box}
.det textarea{min-height:72px;resize:vertical}
.det .rev{display:flex;align-items:center;gap:12px}
.det .rev button{width:38px;height:38px;border:1px solid #c4ccd6;border-radius:8px;background:#fff;color:#1f3a5f;font-size:20px;line-height:1}
.det .mini{align-self:flex-start;background:#1f3a5f;color:#fff;border:0;border-radius:8px;padding:7px 16px;font-size:14px;margin-top:6px}
#det-campos.salvando{opacity:.55;pointer-events:none}
#folha-cad{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
#folha-cad[hidden]{display:none}
#folha-cad .conteudo{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;max-height:90dvh;overflow:auto}
.cad-erro{color:#b03a2e;font-size:13px;margin-top:8px;min-height:1px}
.det details summary{padding:6px 0}

/* SENHA (alterar / esqueci) */
#folha-senha{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
#folha-senha .conteudo{width:100%;max-width:520px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;max-height:90dvh;overflow:auto}
#folha-senha h2{margin:0 0 4px;font-size:18px;color:#1f3a5f}
#folha-senha label{display:block;margin-top:10px;font-size:13px;color:#4f5d6b}
#folha-senha input{width:100%;min-height:46px;border:1px solid #c4ccd6;border-radius:8px;padding:0 12px;font-size:16px;margin-top:4px;background:#fff;color:#222}
.sn-msg{font-size:14px;color:#4f5d6b;line-height:1.4}
.sn-erro{color:#b3261e;font-size:14px;margin:8px 0 0}
.sn-botoes{display:flex;gap:10px;margin-top:14px}
.sn-botoes button{flex:1;min-height:46px;border-radius:10px;font-size:16px;font-weight:bold;border:1px solid #1f3a5f}
#sn-salvar{background:#1f3a5f;color:#fff}
#sn-cancelar{background:#fff;color:#1f3a5f}
@media (min-width:900px){#folha-senha{align-items:center}#folha-senha .conteudo{border-radius:16px}}

/* PC (TELA LARGA) */
@media (min-width:900px){
  .cel{display:none!important}
  .titulo-pc{display:inline}
  .topo{border-radius:0;min-height:72px;padding:0 32px;gap:24px;flex-wrap:nowrap;justify-content:space-between}
  .logo-pc{order:1}
  .troca{order:2;flex:0 0 320px;margin-top:0}
  .usr-pc{order:3}
  .logo-pc{display:block;height:42px;width:auto}
  .usr-pc{display:flex;align-items:center;gap:16px;color:#fff;font-size:15px}
  .usr-pc button{background:none;border:0;color:#d3deeb;font-size:15px;text-decoration:underline;padding:6px 0}
  nav.abas{display:none}
  .corpo{padding:28px 32px 32px}
  #painel-perfil{display:none!important}
  #painel-tarefas{display:flex!important;max-width:1240px;width:100%;margin:24px auto 0}
  body.sem-tarefas #painel-tarefas{display:none!important}
  #lista-inicio{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .filtros-campos{flex-direction:row;flex-wrap:wrap;align-items:center}
  .filtros-campos select{width:auto;min-width:220px}
  #painel-inicio{display:grid!important;max-width:1240px;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto 212px auto;gap:16px 32px;align-items:stretch}
  #painel-inicio>h2{grid-column:1 / -1;grid-row:1;font-size:20px;color:#1f3a5f}
  .grade{grid-column:1;grid-row:2;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;min-width:0}
  .sis{grid-column:var(--cp);width:100%;height:100%;background:#fff;border:1px solid #c4ccd6;border-radius:14px;padding:16px 14px;gap:8px;overflow:hidden}
  .sis .ic{width:72px;height:72px;border-radius:20px}
  .sis .ic svg{width:44px;height:44px}
  .sis .nm{font-size:15px;font-weight:bold;color:#1f3a5f;line-height:1.25}
  .sis .desc{display:block;font-size:12px;color:#4f5d6b;line-height:1.35}
  .caixa-notif{display:flex;grid-column:2;grid-row:2;flex-direction:column;overflow:auto;background:#fff;border:1px solid #c4ccd6;border-radius:14px;padding:12px 18px}
  .caixa-notif .nh{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:bold;color:#1f3a5f}
  .caixa-notif .nb{min-width:22px;height:22px;border-radius:11px;background:#b03a2e;color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .cartao{grid-column:1 / -1;grid-row:3;padding:16px 18px}
  .cartao .filtro{max-width:360px}
}
/* SISTEMA DENTRO DO APP */
#tela-sistema{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:#f4f5f7;display:flex;flex-direction:column}
.sis-topo{flex:0 0 auto;background:#1f3a5f;color:#fff;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.sis-voltar{min-height:40px;padding:0 14px;border-radius:9px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:15px;font-weight:bold}
.sis-nome{flex:1;min-width:0;font-size:16px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sis-quadro{flex:1;min-height:0;position:relative}
.sis-carregando{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;color:#4f5d6b;font-size:14px}
#tela-sistema.fora{visibility:hidden;pointer-events:none;z-index:-1}
.sis-fr{position:absolute;top:0;left:0;width:100%;height:100%;border:0;visibility:hidden}
.sis-fr.ativo{visibility:visible}

/* RESUMO */
#painel-resumo[hidden]{display:none!important}
.res-bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.res-bar h2{margin:0}
.res-alt{background:#fff;color:#1f3a5f;border:1px solid #1f3a5f;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:bold}
.res-hora{font-size:12px;color:#4f5d6b;margin-top:-14px}
#res-corpo{display:flex;flex-direction:column;gap:12px}
.res-obra{background:#fff;border:1px solid #c4ccd6;border-radius:14px;overflow:hidden}
.res-obra>button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px;color:#222}
.res-nome{font-weight:bold;color:#1f3a5f;font-size:15px}
.res-sub{font-size:12px;color:#4f5d6b;margin-top:2px}
.res-faixa{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:8px;background:#e6e9ee}
.res-det{border-top:1px solid #e6e9ee;padding:4px 14px 10px}
.res-det h4{margin:10px 0 2px;font-size:13px;color:#1f3a5f}
.res-lin{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;color:#222}
.pill{display:inline-block;border-radius:10px;padding:3px 9px;font-size:12px;border:1px solid rgba(0,0,0,.14);background:#fff;color:#222;text-align:center;max-width:58%}
button.pill{cursor:pointer}
.cor-amarelo{background:#fff6b3}.cor-verde{background:#c9f0d0}.cor-vermelho{background:#fbd0cf}.cor-azul{background:#cfe0f5}
#res-matriz{display:none}
#painel-resumo.matriz-on{max-width:none}
#painel-resumo.matriz-on #res-cards{display:none}
#painel-resumo.matriz-on #res-matriz{display:block}
.mat-rolagem{overflow:auto;max-height:calc(100vh - 230px);background:#fff;border:1px solid #c4ccd6;border-radius:14px}
.mat{border-collapse:separate;border-spacing:0;font-size:13px}
.mat th,.mat td{padding:6px 8px;border-bottom:1px solid #e6e9ee;border-right:1px solid #eef0f3;white-space:nowrap;text-align:center}
.mat thead th{position:sticky;top:0;background:#1f3a5f;color:#fff;z-index:2;min-width:120px;font-size:12px}
.mat .mat-p{position:sticky;left:0;z-index:1;background:#f4f5f7;min-width:170px;text-align:left}
.mat thead .mat-p{background:#1f3a5f;z-index:4}
.mat td.mat-p{font-weight:600;color:#222}
.mat tr.disc td{background:#e6edf5;color:#1f3a5f;font-weight:bold;text-align:left;position:sticky;left:0}
.mat .pill{display:block;max-width:none}
#res-cores{position:fixed;z-index:90;background:#fff;border:1px solid #c4ccd6;border-radius:12px;padding:8px;display:flex;gap:6px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#res-cores button{width:38px;height:38px;border-radius:10px;border:2px solid #c4ccd6;font-size:11px;color:#4f5d6b}
#res-cores[hidden]{display:none}
nav.abas button[hidden]{display:none!important}
@media (min-width:900px){
  body.em-resumo #painel-inicio,body.em-resumo #painel-tarefas{display:none!important}
  #painel-resumo{max-width:none;width:100%}
  #res-cards{display:none!important}
  #res-matriz{display:block!important}
  .res-alt{display:none}
  .mat-rolagem{max-height:calc(100vh - 190px)}
}

/* MENU / SESSOES / PERFIL */
.res-faixa{height:12px;background:#fff;border:1px solid #c4ccd6;box-sizing:border-box}
.res-det h4{margin:12px 0 2px;padding-top:10px;border-top:1px solid #dde1e6}
.res-det h4:first-child{border-top:0;margin-top:6px;padding-top:0}
.mat tr.disc td{border-top:3px solid #dde1e6}
.mat tbody tr:first-child td{border-top:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;border:1px solid rgba(0,0,0,.2);margin:0 3px 0 2px;vertical-align:-1px}
#menu-app{position:fixed;z-index:80;left:12px;bottom:78px;background:#fff;border:1px solid #c4ccd6;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:6px;min-width:230px;display:flex;flex-direction:column}
#menu-app[hidden]{display:none}
#menu-app button{min-height:46px;border:0;background:none;text-align:left;padding:0 14px;font-size:15px;color:#1f3a5f;border-radius:8px;font-weight:bold}
#menu-app button.on{background:#e8edf3}
.pf-form{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px}
.pf-form label{font-size:12px;color:#4f5d6b;font-weight:bold;display:flex;flex-direction:column;gap:4px}
.pf-form input{min-height:44px;border-radius:6px;border:1px solid #c4ccd6;padding:0 12px;font-size:15px;background:#fff;color:#222}
.pf-form input[readonly]{background:#f4f5f7;color:#4f5d6b}
#grade-apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px}
#grade-apps .sis,#grade-ctl .sis{grid-column:auto}
#grade-ctl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 8px}
#menu-sub{display:flex;flex-direction:column}
.todas-f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.todas-f select,.todas-f input[type=text]{font:inherit;font-size:14px;padding:8px;border:1px solid #c4ccd6;border-radius:8px;background:#fff;min-width:0;width:100%;box-sizing:border-box}
@media (min-width:900px){
  body:not(.aba-inicio) #painel-inicio{display:none!important}
  body:not(.aba-tarefas) #painel-tarefas{display:none!important}
  body.aba-tarefas #painel-tarefas{display:flex!important}
  body.aba-perfil #painel-perfil{display:flex!important;max-width:560px;margin:24px auto 0}
  #painel-apps{max-width:1240px;width:100%;margin:24px auto 0}
  #grade-apps{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  #painel-ctl{max-width:1240px;width:100%;margin:24px auto 0}
  #painel-todas{max-width:900px;width:100%;margin:24px auto 0}
  .todas-f{grid-template-columns:repeat(4,1fr)}
  #grade-ctl{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
  #menu-app{top:76px;right:32px;left:auto;bottom:auto}
}
.mat{width:100%}
.mat thead th{min-width:90px;white-space:normal}
.mat td.cm{white-space:normal;font-size:12px;min-width:90px;padding:7px 6px;border:1px solid #fff}
.mat td.edit{cursor:pointer}
.mat td.cm.cor-amarelo{background:#fff6b3}.mat td.cm.cor-verde{background:#c9f0d0}.mat td.cm.cor-vermelho{background:#fbd0cf}.mat td.cm.cor-azul{background:#cfe0f5}
@media (min-width:900px){
  #nome-pc,#alterar-senha,#ir-email{display:none!important}
  #ir-inicio{text-decoration:none;display:flex;align-items:center}
}
.ico-btn{width:40px;height:40px;flex:0 0 auto;border-radius:10px;border:1px solid #c4ccd6;background:#fff;color:#1f3a5f;display:flex;align-items:center;justify-content:center;padding:0}
.ico-btn.ativo{background:#1f3a5f;color:#fff;border-color:#1f3a5f}
#res-alt{display:none!important}
.pf-nome{display:flex;align-items:center;justify-content:center;gap:8px}
.pf-nome h2{margin:0}
.pf-nome .ico-btn{width:34px;height:34px}
.pf-acoes{display:flex;gap:8px;justify-content:center;width:100%}
.painel.perfil .sair{width:auto;min-height:38px;font-size:14px;padding:0 20px}
</style>

<script>
(function () {
  'use strict';

  var API = 'https://script.google.com/macros/s/AKfycbxF-7TOyL8YyNmawN-MW3crYqy5YALc3vVWW8mGkWTSOPGgigx4rhgdCM8IvOc_RqMT/exec';
  var CHAVE = 'engelix_sessao';      // { token, nome }
  var CHAVE_CACHE = 'engelix_cache'; // { usuario, secoes } (último que o servidor mandou)
  var CHAVE_EMP = 'engelix_empresa';

  var ICONES = {
    controle: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="m9 14 2 2 4-4"/>',
    memoriais: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/>',
    cargatermica: '<path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/>',
    email: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
    diario: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    geral: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>'
  };

  var TAREFAS = [];              // tarefas da pessoa (vêm do Controle; somente leitura)
  var TAREFAS_OK = false;        // true = equipe da Engenharia (cliente não vê tarefas)
  var CHAVE_TAREFAS = 'engelix_tarefas';
  var fObra = '', fDisc = '', fSit = '';
  var carregandoTarefas = false;

  var NOTIFS = [], NAO_LIDAS = 0, notifTimer = 0;

  var FILTROS = [['todas', 'Todas'], ['resp', 'Responsável'], ['apoio', 'Apoio']];
  var filtro = 'todas';
  var tempoAviso = null;
  var TOKEN = '';
  var SECOES = [];
  var empresaSel = '';

  function $(id) { return document.getElementById(id); }

  function lerJson(chave) {
    try { return JSON.parse(localStorage.getItem(chave)); } catch (e) { return null; }
  }
  function gravarJson(chave, valor) {
    try { localStorage.setItem(chave, JSON.stringify(valor)); } catch (e) {}
  }
  function apagar(chave) {
    try { localStorage.removeItem(chave); } catch (e) {}
  }

  function avisar(msg) {
    var el = $('aviso');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(tempoAviso);
    tempoAviso = setTimeout(function () { el.hidden = true; }, 2800);
  }

  /* ---------- COMUNICAÇÃO COM O SERVIDOR (Apps Script) ---------- */
  function api(corpo) {
    return fetch(API, { method: 'POST', body: JSON.stringify(corpo) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.erro || 'Erro inesperado.');
        return j.dados;
      }, function () {
        throw new Error('Sem conexão com o servidor. Tente de novo.');
      });
  }

  function aparelho() {
    var u = navigator.userAgent || '';
    return (/iPhone|iPad/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : 'Computador') + ' · app';
  }

  /* ---------- LOGIN ---------- */
  var listaNomes = [];     // equipe (quem digita o nome)
  var modoCliente = false;
  var promessaNomes = null;

  function mostrarErroLogin(msg) {
    $('erro').textContent = msg;
    $('erro').hidden = false;
  }

  function norm(t) {
    return String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  function acharNome(txt) {
    var alvo = norm(txt);
    if (!alvo) return '';
    for (var i = 0; i < listaNomes.length; i++) if (norm(listaNomes[i]) === alvo) return listaNomes[i];
    return '';
  }

  function atualizarDica() {
    var n = acharNome($('usuario').value);
    $('dica').textContent = n ? '✓ ' + n : '';
  }

  function corrigirCampo() {
    var n = acharNome($('usuario').value);
    if (n) $('usuario').value = n;
    atualizarDica();
  }

  function definirModoCliente(sim) {
    modoCliente = sim;
    $('erro').hidden = true;
    $('bloco-usuario').hidden = sim;
    $('bloco-cliente-sel').hidden = !sim;
    $('sou-cliente').textContent = sim ? 'Voltar ao login da equipe' : 'Sou cliente';
    $('senha').value = '';
    $('senha').type = 'password';
    $(sim ? 'senha' : 'usuario').focus();
  }

  function montarNomes(dados) {
    var vistos = {}, clientes = dados.clientes || [];
    listaNomes = [];
    (dados.grupos || []).forEach(function (g) {
      g.nomes.forEach(function (n) {
        if (clientes.indexOf(n) < 0 && !vistos[n]) { vistos[n] = true; listaNomes.push(n); }
      });
    });
    corrigirCampo();
  }

  function carregarNomes() {
    promessaNomes = api({ acao: 'nomes' }).then(montarNomes).catch(function (e) {
      promessaNomes = null;
      throw e;
    });
    promessaNomes.catch(function () {});
    return promessaNomes;
  }

  function mostrarLogin(msg) {
    modoCliente = false;
    $('sou-cliente').textContent = 'Sou cliente';
    $('usuario').value = '';
    $('dica').textContent = '';
    $('bloco-usuario').hidden = false;
    $('bloco-cliente-sel').hidden = true;
    $('senha').value = '';
    $('senha').type = 'password';
    $('erro').hidden = true;
    if (msg) mostrarErroLogin(msg);
    $('tela-app').hidden = true;
    $('tela-login').hidden = false;
    carregarNomes();
  }

  $('sou-cliente').addEventListener('click', function () { definirModoCliente(!modoCliente); });
  $('usuario').addEventListener('input', atualizarDica);
  $('usuario').addEventListener('blur', corrigirCampo);

  $('form-login').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('btn-entrar');
    if (btn.disabled) return;
    $('erro').hidden = true;
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    var pronto = modoCliente ? Promise.resolve() : (promessaNomes || carregarNomes());
    pronto.then(function () {
      if (modoCliente) {
        if (!$('senha').value) throw new Error('Digite a senha.');
        return api({ acao: 'entrarCliente', senha: $('senha').value, aparelho: aparelho() });
      }
      var nome = acharNome($('usuario').value);
      if (!nome) throw new Error($('usuario').value.trim() ? 'Usuário não encontrado.' : 'Digite seu usuário.');
      $('usuario').value = nome;
      return api({ acao: 'entrar', nome: nome, senha: $('senha').value, aparelho: aparelho() });
    }).then(function (d) {
      TOKEN = d.token;
      gravarJson(CHAVE, { token: d.token, nome: d.usuario.nome });
      gravarJson(CHAVE_CACHE, { usuario: d.usuario, secoes: d.secoes });
      mostrarApp(d, false);
    }).catch(function (err) { mostrarErroLogin(err.message); })
      .then(function () { btn.disabled = false; btn.textContent = 'Entrar'; });
  });

  $('olho').addEventListener('click', function () {
    var c = $('senha');
    c.type = c.type === 'password' ? 'text' : 'password';
    this.setAttribute('aria-label', c.type === 'password' ? 'Mostrar senha' : 'Ocultar senha');
  });

    if (n === 4) return ['span 3', 'span 3', 'span 3', 'span 3'];

    var resto = n % 3;

  }

  function colunasPc(n) {

    for (i = 0; i < n; i++) c.push('span 4');
    var resto = n % 3;
    if (resto === 1) c[n - 1] = '5 / span 4';
    if (resto === 2) c[n - 2] = '3 / span 4';

  $('form-senha').addEventListener('submit', function (e) {
    e.preventDefault();
    var nova = $('sn-nova').value;
    if (nova.length < 4) { erroSenha('A nova senha precisa ter pelo menos 4 caracteres.'); return; }
    if (/\s/.test(nova)) { erroSenha('A senha não pode ter espaços.'); return; }
    if (nova !== $('sn-nova2').value) { erroSenha('As duas senhas novas não são iguais.'); return; }
    $('sn-salvar').disabled = true;
    $('sn-erro').hidden = true;
    var modo = modoSenha;
    var corpo = (modo === 'alterar')
      ? { acao: 'alterarSenha', token: TOKEN, senhaAtual: $('sn-atual').value, novaSenha: nova }
      : { acao: 'redefinirSenha', nome: nomeRec, codigo: $('sn-codigo').value, novaSenha: nova };
    api(corpo).then(function () {
      fecharSenha();
      if (modo === 'alterar') { avisar('Senha alterada com sucesso.'); }
      else { $('senha').value = ''; avisar('Senha redefinida. Entre com a nova senha.'); }
    }).catch(function (err) {
      $('sn-salvar').disabled = false;
      if (modo === 'alterar' && err && err.message === 'SESSAO_INVALIDA') { fecharSenha(); tratarErro(err); return; }
      erroSenha(err && err.message ? err.message : 'Erro inesperado.');
    });
  });

  $('esqueci').addEventListener('click', function () {
    var nome = acharNome($('usuario').value);
    if (modoCliente || !nome) { mostrarErroLogin('Digite seu usuário acima e toque em "Esqueci minha senha".'); return; }
    $('esqueci').disabled = true;
    api({ acao: 'esqueciSenha', nome: nome }).then(function (d) {
      $('esqueci').disabled = false;
      $('erro').hidden = true;
      nomeRec = nome;
      abrirSenha('recuperar', 'Enviamos um código de 6 números para ' + d.email + '. Ele vale por 10 minutos.');
    }).catch(function (err) {
      $('esqueci').disabled = false;
      mostrarErroLogin(err && err.message ? err.message : 'Erro inesperado.');
    });
  });

  $('sino').addEventListener('click', function () { $('folha-notif').hidden = false; carregarNotifs(); });
  $('lidas-cel').addEventListener('click', function () { marcarLidas(null); });
  $('lidas-pc').addEventListener('click', function () { marcarLidas(null); });
  $('fechar-notif').addEventListener('click', function () { $('folha-notif').hidden = true; });
  $('folha-notif').addEventListener('click', function (e) {
    if (e.target === this) this.hidden = true;
  });

  /* ---------- INICIO ---------- */
  var sessao = lerJson(CHAVE);
  if (sessao && sessao.token) {
    TOKEN = sessao.token;
    var cache = lerJson(CHAVE_CACHE);
    if (cache && cache.usuario) mostrarApp(cache, false);   // abre na hora com o que já sabe
    api({ acao: 'sessao', token: TOKEN }).then(function (d) {
      gravarJson(CHAVE_CACHE, d);
      mostrarApp(d, true);
    }).catch(function (e) {
      if (e && e.message === 'SESSAO_INVALIDA') { sairLocal('Sua sessão terminou. Entre novamente.'); }
      else if (!(cache && cache.usuario)) { mostrarLogin(e.message); }
    });
  } else {
    mostrarLogin();
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
