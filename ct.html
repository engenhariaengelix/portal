<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGELIX Carga Térmica</title>
<style>
* { box-sizing: border-box; }
:root { --az:#1f3a5f; --az2:#2d5286; --bd:#c4ccd6; --mut:#6c7a89; --er:#b03a2e; --al:#b26a00; }
body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f5f7; color: #222; font-size: 14px; }
[hidden] { display: none !important; }

/* ===== Padrão ENGELIX (igual ao Controle de Projetos) ===== */
header { background: #1f3a5f; color: #fff; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
header h1 { font-size: 16px; margin: 0; }
header .esq { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header .usuario { font-size: 13px; }
header .usuario a { color: #cfe0f5; text-decoration: underline; cursor: pointer; margin-left: 10px; }
.btn-nav { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; cursor: pointer; padding: 5px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn-nav:hover { background: rgba(255,255,255,.25); }
.abas { display: flex; background: #dde3ea; border-bottom: 1px solid #c4ccd6; }
.abas button { flex: none; padding: 10px 16px; background: none; border: none; cursor: pointer; font-size: 14px; color: #444; border-bottom: 3px solid transparent; }
.abas button.ativa { border-bottom-color: #1f3a5f; color: #1f3a5f; font-weight: bold; }
.conteudo { padding: 12px; max-width: 1320px; margin: 0 auto; }
button.acao { background: #1f3a5f; color: #fff; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
button.acao:hover { background: var(--az2); }
button.acao.secundaria { background: #6c7a89; }
button.acao.perigo { background: #b03a2e; }
button.acao.sm { padding: 4px 9px; font-size: 12px; }
button.ic { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px; padding: 0; border: 0; border-radius: 4px; background: var(--az); color: #fff; cursor: pointer; }
button.ic:hover { filter: brightness(1.2); }
button.ic.secundaria { background: #6c7a89; }
button.ic.perigo { background: #b03a2e; }
#tela-login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1f3a5f; }
.caixa-login { background: #fff; border-radius: 8px; padding: 24px; width: 92%; max-width: 360px; }
.caixa-login h1 { font-size: 18px; margin-top: 0; text-align: center; color: #1f3a5f; }
.lista-nomes { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
.lista-nomes button { padding: 10px; border: 1px solid #c4ccd6; background: #f4f5f7; border-radius: 4px; cursor: pointer; font-size: 14px; text-align: left; }
.lista-nomes button:hover { background: #e4e9f0; }
.caixa-login input { width: 100%; padding: 8px; border: 1px solid #c4ccd6; border-radius: 4px; font-size: 14px; margin-top: 8px; }
.caixa-login .rodape-login { display: flex; justify-content: space-between; margin-top: 14px; }
.campo-senha-wrap { position: relative; margin-top: 8px; }
.campo-senha-wrap input { margin-top: 0; padding-right: 42px; }
.btn-ver-senha { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 6px; color: #6c7a89; line-height: 0; }
.btn-ver-senha:hover { color: #1f3a5f; }
.carregando { padding: 30px; text-align: center; color: #888; }
.logo-login { width: 220px; max-width: 70%; margin-bottom: 18px; }
.logo-topo { height: 34px; display: block; }
.erro { color: var(--er); font-size: 13px; min-height: 18px; margin-top: 8px; }
@media (max-width: 700px) { .conteudo { padding: 8px; } .abas { overflow-x: auto; } .abas button { padding: 10px 12px; white-space: nowrap; } header { padding: 8px 10px; } .logo-topo { height: 28px; } }

/* ===== App ===== */
h2 { color: var(--az); margin: 0 0 4px; font-size: 20px; } h3 { color: var(--az); font-size: 15px; margin: 0 0 10px; }
.sub { color: var(--mut); font-size: 13px; margin-bottom: 4px; }
.barra { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; } .barra .esp { flex: 1; }
.card { background: #fff; border: 1px solid #d5dae1; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
/* Formulário alinhado: rótulo com altura fixa (2 linhas) e controle com altura fixa */
.grid { display: grid; gap: 10px 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); align-items: start; }
.grid .c2 { grid-column: span 2; } .grid .c3 { grid-column: span 3; }
@media (max-width: 560px) { .grid .c2, .grid .c3 { grid-column: span 1; } }
.campo label { display: flex; align-items: flex-end; min-height: 30px; font-size: 12px; color: var(--mut); margin-bottom: 3px; line-height: 1.2; }
input, select, textarea { font-family: inherit; font-size: 13px; border: 1px solid var(--bd); border-radius: 4px; padding: 0 8px; background: #fff; width: 100%; height: 34px; }
textarea { height: auto; padding: 7px 8px; }
input:focus, select:focus, textarea:focus { outline: 2px solid #9db8dc; border-color: var(--az); }
input[type=checkbox] { width: auto; height: auto; }
input[readonly] { background: #eef1f6; color: #444; }
.tw { overflow-x: auto; border: 1px solid #d5dae1; border-radius: 8px; background: #fff; }
.tbl { width: 100%; border-collapse: collapse; background: #fff; }
.tbl th { background: var(--az); color: #fff; font-weight: normal; font-size: 12px; padding: 7px 6px; text-align: center; }
.tbl td { border-top: 1px solid #e6e9ee; padding: 5px 6px; font-size: 13px; vertical-align: middle; }
.tbl td.c { text-align: center; } .tbl td.r { text-align: right; }
.tbl tr.pav td { background: #e8edf4; color: var(--az); font-weight: bold; }
#tamb tr.pav { cursor: pointer; user-select: none; }
#tamb tr.pav:hover td { background: #dde5f0; }
#tamb tr.pav .seta { display: inline-block; width: 16px; font-size: 11px; }
#tamb tr.pav .qtd { font-weight: normal; color: var(--mut); font-size: 12px; }
#tamb tr.lin.rec { display: none !important; }
#tamb.filtrando tr.lin.rec:not([hidden]) { display: table-row !important; }
@media (max-width: 700px) { #tamb.filtrando tr.lin.rec:not([hidden]) { display: block !important; } }
.tbl tr.tot td { background: #eef1f6; font-weight: bold; }
.tbl tr.al td { background: #fff6e5; }
.tbl tr.rd td { background: #efe3fa; }
.tbl tr.rd.lin:hover td { background: #e4d2f5; }
.tag.rd { background: #e6d5f5; color: #5b2c83; }
.tbl td input, .tbl td select { height: 30px; }
.tag { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 10px; background: #fff1d6; color: var(--al); white-space: nowrap; }
.tag.ok { background: #e3f3e5; color: #2e7d32; }
.dica { font-size: 11px; color: var(--mut); margin-top: 3px; }
.ed { display: grid; grid-template-columns: minmax(0,1fr) 330px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .ed { grid-template-columns: 1fr; } .prev { position: static !important; } }
.prev { position: sticky; top: 10px; } .prev .big { font-size: 28px; font-weight: bold; color: var(--az); }
.prev table { width: 100%; border-collapse: collapse; font-size: 12px; } .prev td { padding: 3px 0; border-bottom: 1px dashed #e0e4ea; } .prev td:last-child { text-align: right; }
.linha-multi { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); align-items: end; margin-bottom: 6px; }
.linha-multi > * { min-width: 0; }
.seta { padding: 1px 6px; line-height: 1.2; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 30; }
#modal .mb { background: #fff; border-radius: 8px; padding: 18px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; }
#busy { position: fixed; inset: 0; background: rgba(255,255,255,.55); z-index: 40; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--az); }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 6px; z-index: 50; max-width: 90%; }
#toast.er { background: var(--er); }
.tbl tr.lin:hover td { background: #e9f0fa; }
.tbl tr.al.lin:hover td { background: #ffeecb; }
.parea { font-size: 11px; color: var(--az); margin-top: 3px; min-height: 14px; }
.totw { font-size: 13px; color: var(--az); text-align: right; margin-top: 6px; }
#prevbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: #1f3a5f; color: #fff; padding: 9px 14px; z-index: 20; font-size: 14px; text-align: center; }
/* ===== Celular / tablet (só preenchimento; o PDF e o Excel mantêm o padrão de computador) ===== */
@media (max-width: 960px) { #prevbar:not([hidden]) { display: block; } .conteudo { padding-bottom: 64px; } }
@media (max-width: 700px) {
  body { font-size: 15px; }
  input, select, textarea { font-size: 16px; height: 42px; }
  textarea { height: auto; }
  input[type=checkbox] { width: 22px; height: 22px; }
  button.acao { padding: 11px 14px; font-size: 14px; }
  button.acao.sm { padding: 9px 12px; font-size: 13px; }
  .btn-nav { padding: 9px 11px; }
  h2 { font-size: 18px; }
  .barra { gap: 6px; }
  .barra > input { max-width: none !important; width: 100%; }
  .barra > button.acao { flex: 1 1 auto; }
  .barra > .dica { flex: 1 1 100% !important; }
  .card { padding: 12px; }
  .tw { border: none; background: none; overflow: visible; border-radius: 0; }
  .tbl.resp, .tbl.resp tbody { display: block; width: 100%; background: none; }
  .tbl.resp tr:first-child { display: none; }
  .tbl.resp tr { display: block; background: #fff; border: 1px solid #d5dae1; border-radius: 8px; margin: 0 0 10px; padding: 6px 10px; }
  .tbl.resp tr.pav, .tbl.resp tr.tot { background: #e8edf4; }
  .tbl.resp tr.al { background: #fff6e5; }
  .tbl.resp tr.rd { background: #efe3fa; }
  .tbl.resp td { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; padding: 5px 0; text-align: right !important; background: transparent !important; }
  .tbl.resp td::before { content: attr(data-l); color: var(--mut); font-size: 12px; text-align: left; flex: 0 0 42%; }
  .tbl.resp td:not([data-l])::before, .tbl.resp td[data-l=""]::before { display: none; }
  .tbl.resp td:empty { display: none; }
  .tbl.resp td input, .tbl.resp td select { width: 56%; flex: none; }
  .tbl.resp td.acoes { justify-content: flex-end; flex-wrap: wrap; }
  .tbl.resp tr.pav td, .tbl.resp tr.tot td[colspan] { display: block; text-align: left !important; }
  .tbl.resp tr.pav td::before, .tbl.resp tr.tot td::before { display: none; }
  .tbl.resp tr.tot td:first-child { font-weight: bold; }
  .tbl.resp tr.tot td:not(:first-child)::before { display: block; }
  .linha-multi { grid-template-columns: 1fr 1fr !important; }
  .linha-multi > button { grid-column: span 2; }
  #modal .mb { padding: 14px; }
}

/* ===== Tela nativa no app ENGELIX (barra enxuta, sem cabeçalho próprio) ===== */
body { background: #f4f5f7; }
.topo { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 6px; background: #fff; border-bottom: 1px solid #d5dae1; padding: 6px 10px; }
.topo .tb { background: #f4f5f7; color: #1f3a5f; border: 1px solid #c4ccd6; border-radius: 8px; padding: 7px 11px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.topo .esp { flex: 1; }
.barra.cmp > button.acao { flex: 0 0 auto; padding: 7px 12px; font-size: 13px; }
.barra.cmp > .dica { flex: 1 1 auto !important; }
.barra.nw { flex-wrap: nowrap; }
.barra.nw > div:first-child { flex: 1 1 auto; min-width: 0; }
.barra.nw .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra > button.ic { flex: 0 0 auto; width: 36px; height: 34px; }
.obra-tit { display: flex; align-items: center; gap: 8px; min-width: 0; }
.obra-tit h2 { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.il { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #e1e6ec; padding: 8px 0; }
.il small { font-size: 12px; color: #4f5d6b; } .il span { font-size: 15px; color: #222; }

/* ===== Celular: tudo mais compacto ===== */
@media (max-width: 700px) {
  body { font-size: 14px; }
  input, select, textarea { font-size: 15px; height: 38px; }
  textarea { height: auto; }
  button.acao { padding: 7px 12px; font-size: 13px; }
  button.acao.sm { padding: 5px 9px; font-size: 12px; }
  .barra > button.acao { flex: 0 0 auto; }
  .card { padding: 10px; }
  h3 { font-size: 14px; margin: 0 0 8px; }
  .campo label { min-height: 0; }
  .grid { gap: 8px 10px; }
  #prevbar { padding: 7px 12px; font-size: 13px; }
  .topo .tb { padding: 6px 9px; }
}
/* ===== Janelas: um cartão por orientação ===== */
.jan-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.jan { background: #fff; border: 1px solid #d5dae1; border-left: 6px solid #1f3a5f; border-radius: 8px; padding: 8px 10px; }
.jan.int { border-left-color: #8fb3dd; }
.jan-t { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.jan-t b { font-size: 19px; letter-spacing: .5px; color: #1f3a5f; text-transform: uppercase; flex: 1; }
.jan-t .sg { font-size: 12px; font-weight: bold; color: #fff; background: #1f3a5f; border-radius: 10px; padding: 2px 9px; }
.jan.int .jan-t .sg { background: #4a7bb7; }
.jan-g { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.jan-g .w2 { grid-column: span 2; }
.jan-g .campo label { min-height: 0; }
.barra.fim { margin: 4px 0 14px; }
.barra.fim button.acao { flex: 1 1 0; padding: 10px 12px; font-size: 14px; }
</style>
</head>
<body>

<div id="tela-login">
  <img class="logo-login" alt="ENGELIX">
  <div class="caixa-login">
    <h1>Carga Térmica</h1>
    <div id="area-nomes"><div class="carregando">Carregando...</div></div>
    <div id="area-senha" style="display:none;">
      <p id="nome-selecionado" style="font-weight:bold;"></p>
      <div class="campo-senha-wrap">
        <input type="password" id="campo-senha" placeholder="Senha" autocomplete="current-password" onkeydown="if (event.key === 'Enter') { tentarEntrar(); }">
        <button type="button" class="btn-ver-senha" id="btn-ver-senha" onclick="alternarVerSenha()" title="Mostrar ou ocultar a senha" aria-label="Mostrar ou ocultar a senha"></button>
      </div>
      <div class="rodape-login">
        <span style="cursor:pointer;color:#1f3a5f;text-decoration:underline;font-size:13px;" onclick="voltarParaNomes()">voltar</span>
        <button class="acao" onclick="tentarEntrar()">Entrar</button>
      </div>
    </div>
    <div id="erro-login" class="erro"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="topo">
  <button class="tb" id="btn-voltar" onclick="voltar()" title="Voltar">&#8249; Voltar</button>
  <button class="tb" id="btn-casa" onclick="irInicio()" title="Início da Carga Térmica">Obras</button>
  <button class="tb" id="nb-params" onclick="irParams()" hidden>Parâmetros</button>
  <span class="esp"></span>
  <button class="tb" id="btn-info" onclick="infoApp()" title="Informações" aria-label="Informações"></button>
  <span id="nome-usuario-topo" hidden></span>
</div>
  <div class="conteudo" id="main"></div>
</div>

<div id="modal" hidden><div class="mb" id="mb"></div></div>
<div id="busy" hidden>Aguarde...</div>
<div id="toast" hidden></div>
<div id="prevbar" hidden></div>
<!-- pdf.js (gratuito) para ler as pranchas no navegador -->
<script type="module">
  import * as pdfjs from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
  pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
  window.pdfjsLib = pdfjs;
</script>
<script>
/* ===================== Leitor das pranchas do PBA (ambientes por pavimento) - mesmo método do app de Memoriais ===================== */
var LeitorPBA = (function () {
  var LET = 'A-ZÁÉÍÓÚÂÊÔÃÕÇÀÜ';
  var AREA = /^(\d{1,3}(?:\.\d{3})*,\d{2})\s*m²$/;
  var COD = /^\d(\/\d)?$/;
  var NUM = /^\d{2}$/;
  var NOME = new RegExp('^[' + LET + '(][' + LET + 'a-zà-ú0-9 .\'()/\\-–]*$');
  var PT = '(?:HF|HQ|AC|VF|E|ED|VP|FAM|FO|EE|FVC)\\*?', PTS = new RegExp('^' + PT + '(?:\\s*[;,]\\s*' + PT + ')*$');
  var TIT = /PLANTA BAIXA\s+(?:DO\s+|DE\s+)?(PAVIMENTO\s+\d{1,2}|T[ÉE]RREO|SUBSOLO|COBERTURA|MEZANINO)/i;
  var TIT_IGN = /PLANTA ESQUEM[ÁA]TICA|PLANTA DE LOCA[ÇC][ÃA]O|PLANTA DE SITUA[ÇC][ÃA]O|LAYOUT|PLANTA DE COBERTURA|PLANTA BAIXA\s+(?:DE\s+|DA\s+)?COBERTURA/i;
  var LIXO = /\b(EXISTENTE|REFORMA|NOV[OA])\s+[PJ][NE]?\d+\b|\bJANELAS\b|\bLARGURA\b|\bESCALA$|^[PJ][NE]?\d+$/i;
  var QUADRO = /^([PJ]\d+|JANELAS|PORTAS|PISO|ESCALA|PLANTA)/;

  // texto de cada página em "tokens": um por linha de texto (junta pedaços colados na mesma linha)
  async function tokensPagina(pagina) {
    var tc = await pagina.getTextContent(), out = [], ult = null;
    tc.items.forEach(function (it) {
      var s = it.str; if (!s || !s.trim()) { if (it.hasEOL && ult) ult.fim = true; return; }
      var t = it.transform, tam = Math.hypot(t[0], t[1]) || 1, dx = t[0] / tam, dy = t[1] / tam;
      if (ult && !ult.fim && Math.hypot(t[4] - ult.x2, t[5] - ult.y2) < 1.6 * tam && Math.abs(tam - ult.tam) < 0.5) {
        ult.s += (Math.hypot(t[4] - ult.x2, t[5] - ult.y2) > 0.25 * tam ? ' ' : '') + s;
      } else { ult = { s: s, x: t[4], y: t[5], tam: tam }; out.push(ult); }
      ult.x2 = t[4] + dx * it.width; ult.y2 = t[5] + dy * it.width; ult.fim = !!it.hasEOL;
    });
    out.forEach(function (o) { o.s = o.s.replace(/\s+/g, ' ').trim(); });
    return out;
  }

  // Cada ambiente é lido pela área ("12,34 m²"); depois vêm o nome, os códigos e os pontos ("HF; AC; VF"). ac = true (tem ponto AC), false (tem pontos, sem AC), null (a prancha não traz pontos).
  function lerTokens(toks) {
    var titulos = [];
    toks.forEach(function (t) {
      if (t.tam < 9) return;
      if (TIT_IGN.test(t.s)) titulos.push({ x: t.x, y: t.y, nome: null });              // desenho que não é planta de pavimento
      else { var m = t.s.match(TIT); if (m) titulos.push({ x: t.x, y: t.y, nome: m[1].replace(/\s+/g, ' ').toUpperCase() }); }
    });
    var amb = [];
    toks.forEach(function (t, i) {
      var m = t.s.match(AREA); if (!m) return;
      var nome = [], num = null, k = i + 1;
      for (; k < Math.min(toks.length, i + 12); k++) {
        var s = toks[k].s;
        if (NUM.test(s) && nome.length && num === null && toks[k + 1] && COD.test(toks[k + 1].s.split(' ')[0])) { num = s; continue; }
        if (COD.test(s.split(' ')[0]) || AREA.test(s) || PTS.test(s) || !NOME.test(s) || /^PISO/.test(s)) break;
        nome.push(s);
      }
      if (!nome.length) return;
      var pts = null;
      for (var j = k; j < Math.min(toks.length, i + 16); j++) { if (AREA.test(toks[j].s)) break; if (PTS.test(toks[j].s)) { pts = toks[j].s; break; } }
      var n = nome.join(' ').replace(/\s+(AC|HF|VF|E|ED)$/, '').replace(/\s*\(\s*/g, ' (').replace(/\s+/g, ' ').trim();
      var mn = n.match(/^(.*\S)\s+(\d{2})$/); if (mn && !num) { n = mn[1]; num = mn[2]; }
      if (QUADRO.test(n) || LIXO.test(n) || n.length < 3) return;
      var dist = function (x) { return (t.y - x.y) + 1.5 * Math.abs(t.x - x.x); };          // o título fica abaixo do desenho
      var abaixo = titulos.filter(function (x) { return x.y < t.y + 5; }).sort(function (a, b) { return dist(a) - dist(b); });
      var tit = abaixo.length ? abaixo[0] : null;
      if (!tit || !tit.nome) return;                                                        // sem título ou desenho ignorado
      if (tit.nome === 'COBERTURA') return;
      amb.push({ pav: tit.nome, area: m[1], nome: n, num: num, pts: pts, ac: pts ? /\bAC\b/.test(pts) : null });
    });
    return amb;
  }

  async function lerPDF(pdfjs, dados) {
    var doc = await pdfjs.getDocument({ data: dados }).promise, res = { ambientes: [], paginas: doc.numPages };
    for (var p = 1; p <= doc.numPages; p++) res.ambientes = res.ambientes.concat(lerTokens(await tokensPagina(await doc.getPage(p))));
    return res;
  }

  // ---------- nomes ----------
  var ABREV = { 'SANIT': 'SANITARIO', 'PUB': 'PUBLICO', 'FUNC': 'FUNCIONARIO', 'MASC': 'MASCULINO', 'FEM': 'FEMININO', 'TEMP': 'TEMPORARIO', 'ADM': 'ADMINISTRATIVA' };
  var STOP = { 'DE': 1, 'DA': 1, 'DO': 1, 'DAS': 1, 'DOS': 1 };
  function singular(w) {
    if (w.length <= 3) return w;
    if (/OES$/.test(w)) return w.slice(0, -3) + 'AO';
    if (/[AEO]IS$/.test(w)) return w.slice(0, -2) + 'L';
    if (/S$/.test(w) && !/SS$/.test(w)) return w.slice(0, -1);
    return w;
  }
  function norm(s) {
    return String(s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean)
      .map(function (w) { return singular(ABREV[w] || w); }).filter(function (w) { return !STOP[w]; }).join(' ');
  }
  function nomePav(p) {
    if (/^PAVIMENTO\s+(\d+)/.test(p)) return 'Pavimento ' + ('0' + p.match(/\d+/)[0]).slice(-2);
    if (/T[ÉE]RREO/.test(p)) return 'Pavimento Térreo';
    return p.charAt(0) + p.slice(1).toLowerCase();
  }
  // nome legível a partir do texto da prancha (maiúsculas): expande abreviaturas e mantém siglas
  var EXP = { 'SANIT': 'sanitário', 'PUB': 'público', 'FUNC': 'funcionário', 'MASC': 'masculino', 'FEM': 'feminino', 'TEMP': 'temporário', 'ADM': 'administrativa', 'ACESS': 'acessível' };
  var SIGLAS = { 'DML': 'DML', 'RSSS': 'RSSS', 'AC': 'AC', 'WC': 'WC' };
  function frase(s) {
    var w = String(s).replace(/\s+/g, ' ').trim().split(' ').map(function (p) {
      var m = p.match(/^(\(?)([^()]*?)(\.?)(\)?)$/), core = m ? m[2].toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') : '';
      if (m && EXP[core]) return m[1] + EXP[core] + m[4];
      if (m && SIGLAS[core]) return m[1] + SIGLAS[core] + m[3] + m[4];
      return p.toLowerCase();
    }).join(' ');
    var ab = (w.match(/\(/g) || []).length - (w.match(/\)/g) || []).length; while (ab-- > 0) w += ')';
    return w.charAt(0).toUpperCase() + w.slice(1);
  }
  // lista = ambientes padrão do app (nome, rec = nomes reconhecidos nas pranchas, numerado)
  function classificar(lidos, lista) {
    var pads = [];
    lista.forEach(function (l) {
      String(l.rec || '').split(';').concat([l.nome]).forEach(function (nr) {
        nr = String(nr).trim(); if (!nr) return;
        var base = norm(nr.replace(/\(sem n[uú]mero\)/i, '').replace(/\bNN\b/g, '').replace(/\(\s*\d*\s*guich[eê]s\s*\)/i, ''));
        if (base) pads.push({ l: l, base: base });
      });
    });
    pads.sort(function (a, b) { return b.base.length - a.base.length; });
    return lidos.map(function (a) {
      var nn = norm(a.nome), achou = null, i, p;
      return { pav: nomePav(a.pav), area: a.area, num: a.num, pts: a.pts, ac: a.ac, prancha: a.nome, base: frase(a.nome), numerado: false, padrao: true };
    });
  }
  return { lerPDF: lerPDF, classificar: classificar, norm: norm };
})();
</script>

function norm1_(t){ return String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase(); }

  var p = lerPortal_();

    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) throw new Error(j.erro || 'Não foi possível entrar.');
      var m = String((j.dados && j.dados.url) || '').match(/[?&]chave=([^&#]+)/);

      return srv('entrarComChavePortal', decodeURIComponent(m[1]));
    })
    .then(function (c) { entrarComCredenciais(c.nome, c.senha, false); })
    .catch(function (e) { erroInicial(e && e.message ? e.message : 'Não foi possível entrar.'); });

  }).catch(function (e) {
    if (silencioso) { try { localStorage.removeItem(CHAVE_SESSAO); } catch (x) {} porChave_(); }

async function salvaObra(id){
  var o = { id: id, nome: $('o_nome').value, revisao: $('o_rev').value, fatGeo: pn($('o_fg').value) || 1, construcao: $('o_cons').value, trechoV: pn($('o_tv').value), margem: pn($('o_mg').value), numPav: Math.round(pn($('o_np').value)), pd: pn($('o_pd').value), laje: pn($('o_lj').value) };
  if (!o.nome) return toast('Selecione a obra.', true);
  if (o.numPav < 1) return toast('Informe o nº de pavimentos da obra.', true);
  if (o.pd <= 0) return toast('Informe o pé-direito piso a piso da obra.', true);
  if (o.laje <= 0) return toast('Informe a espessura do piso (considerando a laje).', true);
  if (o.laje >= o.pd) return toast('A espessura do piso deve ser menor que o pé-direito.', true);
  var r = await chamar('salvarObra', o); fechaModal(); toast('Obra salva.');
  if (id && S.obra) { await abrirObra(id, S.tab); } else if (!id) { await abrirObra(r.id); } else irObras();
}
async function excluiObra(id){
  var o = S.obras.filter(function(x){ return x.id === id; })[0] || S.obra;
  var qtd = (S.obra && S.obra.id === id) ? S.itens.length : (o.qtd || 0);
  if (!confirm('Excluir a obra "' + o.nome + '" e ' + qtd + ' ambiente(s) cadastrado(s)? Esta ação não pode ser desfeita.')) return;
  await chamar('excluirObra', id); toast('Obra excluída.'); irObras();
}

function filtraAmb(){
  var q = S.filtro.toLowerCase().trim();

  var t = $('tamb'); if (t) t.classList.toggle('filtrando', !!q);   // ao filtrar, os pavimentos minimizados também mostram o resultado
}
// Minimizar / expandir o pavimento na aba Ambientes (o estado vale enquanto o app estiver aberto)
function pavFechado(p){ S.fechados = S.fechados || {}; return !!S.fechados[(S.obra ? S.obra.id : '') + '|' + p]; }
function aplicaPav(){
  document.querySelectorAll('#tamb tr.pav').forEach(function(tr){
    var p = tr.getAttribute('data-gp'), f = pavFechado(p);
    tr.querySelector('.seta').textContent = f ? '▶' : '▼';
    document.querySelectorAll('#tamb tr.lin').forEach(function(l){ if (l.getAttribute('data-g') === p) l.classList.toggle('rec', f); });
  });
}
// Check "redução confirmada" (previsto -> sugerido): salva na hora e pinta a linha de lilás
async function marcaRed(id, v, el){
  var tr = el.closest('tr');
  try { await chamar('marcarReducao', S.obra.id, id, v); } catch (e) { el.checked = !v; return; }
  (S.itens || []).forEach(function(it){ if (it.a.id === id) it.a.reducao = v; });
  if (S.resumo) S.resumo.linhas.forEach(function(l){ if (l.id === id) l.reducao = v; });
  if (tr) tr.classList.toggle('rd', v);
  toast(v ? 'Redução confirmada.' : 'Redução desmarcada.');
}
function togglePav(tr){
  var k = (S.obra ? S.obra.id : '') + '|' + tr.getAttribute('data-gp'); S.fechados = S.fechados || {};
  S.fechados[k] = !S.fechados[k]; aplicaPav();
}
function todosPav(fechar){
  S.fechados = S.fechados || {};
  document.querySelectorAll('#tamb tr.pav').forEach(function(tr){ S.fechados[(S.obra ? S.obra.id : '') + '|' + tr.getAttribute('data-gp')] = fechar; });
  aplicaPav();
}

async function renumera(){
  if (!confirm('Renumerar o campo "Renomeado" em sequência (1, 2, 3...), seguindo a ordem crescente do AC analisado e mantendo as letras (ex.: 4a e 4b ficam juntos)? Os números atuais serão substituídos.')) return;
  await salvaResumoSilencioso(); await chamar('renumerarObra', S.obra.id); toast('Renumeração concluída.'); abrirObra(S.obra.id, 'resumo');

async function exporta(f){
  if (Object.keys(S.edits).length && confirm('Há alterações não salvas. Salvar antes de exportar?')) await salvaResumoSilencioso();
  var r = await chamar('exportarResumo', S.obra.id, f);
  var bin = atob(r.base64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: r.mime })); a.download = r.nomeArquivo;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Arquivo gerado: ' + r.nomeArquivo);
}

// ZIP simples (sem compressão) montado no próprio navegador: junta PDF, Excel e DXF num único arquivo.
var CRC_T = null;
function crc32(u8){
  if (!CRC_T) { CRC_T = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC_T[n] = c >>> 0; } }
  var x = 0xFFFFFFFF; for (var i = 0; i < u8.length; i++) x = CRC_T[(x ^ u8[i]) & 255] ^ (x >>> 8);
  return (x ^ 0xFFFFFFFF) >>> 0;
}
function montaZip(arqs){
  var enc = new TextEncoder(), partes = [], central = [], off = 0, d = new Date();
  var dt = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dd = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  arqs.forEach(function(a){
    var nome = enc.encode(a.nome), crc = crc32(a.dados), n = a.dados.length;
    var h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(10, dt, true); h.setUint16(12, dd, true);
    h.setUint32(14, crc, true); h.setUint32(18, n, true); h.setUint32(22, n, true); h.setUint16(26, nome.length, true);
    partes.push(new Uint8Array(h.buffer), nome, a.dados);
    var c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(12, dt, true); c.setUint16(14, dd, true);
    c.setUint32(16, crc, true); c.setUint32(20, n, true); c.setUint32(24, n, true); c.setUint16(28, nome.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), nome);
    off += 30 + nome.length + n;
  });
  var tam = 0; central.forEach(function(p){ tam += p.length; });
  var e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, arqs.length, true); e.setUint16(10, arqs.length, true); e.setUint32(12, tam, true); e.setUint32(16, off, true);
  return new Blob(partes.concat(central, [new Uint8Array(e.buffer)]), { type: 'application/zip' });
}
// Botão "Todos os formatos": gera PDF, Excel e DXF e entrega tudo num ZIP.
async function exportaTodos(){
  if (Object.keys(S.edits).length && confirm('Há alterações não salvas. Salvar antes de exportar?')) await salvaResumoSilencioso();
  var arqs = [], base = '';
  var fmts = [['pdf', 'PDF'], ['xlsx', 'Excel'], ['dxf', 'DXF']];
  for (var i = 0; i < fmts.length; i++) {
    toast('Gerando ' + fmts[i][1] + ' (' + (i + 1) + ' de 3)...');
    var r = await chamar('exportarResumo', S.obra.id, fmts[i][0]);
    var bin = atob(r.base64), u8 = new Uint8Array(bin.length);
    for (var k = 0; k < bin.length; k++) u8[k] = bin.charCodeAt(k);
    arqs.push({ nome: r.nomeArquivo, dados: u8 });
    if (!base) base = r.nomeArquivo.replace(/\.[^.]+$/, '');
  }
  var a = document.createElement('a'); a.href = URL.createObjectURL(montaZip(arqs)); a.download = base + '.zip';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Arquivo gerado: ' + base + '.zip (PDF, Excel e DXF)');
}

  modal('<h3>Exportar</h3><div class="dica" style="margin-bottom:12px">Escolha o formato do arquivo.</div><div style="display:flex;flex-direction:column;gap:8px"><button class="acao" onclick="fechaModal();exportaTodos()">Todos os formatos - ZIP com PDF, Excel e DXF</button><button class="acao secundaria" onclick="fechaModal();exporta(\'pdf\')">PDF - tabela Resumo</button><button class="acao secundaria" onclick="fechaModal();exporta(\'xlsx\')">Excel - editável, com os cálculos</button><button class="acao secundaria" onclick="fechaModal();exporta(\'dxf\')">DXF - tabelas por pavimento para o AutoCAD</button></div><div class="barra" style="margin:14px 0 0"><div class="esp"></div><button class="acao secundaria" onclick="fechaModal()">Cancelar</button></div>');
}
/* ---------- IMPORTAR AMBIENTES DAS PRANCHAS (PDF) ---------- */
function pdfNum(s){ return parseFloat(String(s).replace(/\./g, '').replace(',', '.')) || 0; }
function base2(n){ return (n < 10 ? '0' : '') + n; }
function escolheArquivosPBA(){
  var f = $('arq-pba'); if (!f) { f = document.createElement('input'); f.type = 'file'; f.id = 'arq-pba'; f.accept = '.pdf,application/pdf'; f.multiple = true; f.hidden = true; f.onchange = function(){ importaPBA(f.files); }; document.body.appendChild(f); }
  f.value = ''; f.click();
}
async function importaPBA(files){
  if (!files || !files.length) return;
  if (!window.pdfjsLib) return toast('O leitor de PDF ainda está carregando (ou sem internet). Aguarde alguns segundos e tente de novo.', true);
  busy(true);
  try {

// Monta a lista da revisão: marca os que já existem na obra, define o nome com numeração e a sugestão de AC.
function montaImportacao(lidos, arqs){
  var ex = S.itens.map(function(it){ return { pav: it.a.pav, nome: it.a.nome, piso: it.a.piso, usado: false }; });
  lidos = lidos.map(function(x, i){ x.ord = i; return x; }).sort(function(a, b){ return String(a.pav).localeCompare(String(b.pav), 'pt', { numeric: true }) || a.ord - b.ord; });
  var itens = lidos.map(function(x){
    var it = { pav: x.pav, base: x.base, num: x.num, area: pdfNum(x.area), pts: x.pts || '', ac: x.ac, prancha: x.prancha, numerado: x.numerado, padrao: x.padrao, dup: false, marca: false, nome: '' };
    ex.forEach(function(e){
      if (it.dup || e.usado || e.pav !== it.pav || Math.abs(e.piso - it.area) > 0.005) return;
      if (e.nome === it.base || e.nome.indexOf(it.base + ' ') === 0) { e.usado = true; it.dup = true; }
    });
    return it;
  });
  itens.forEach(function(x){ x.nome = x.num ? x.base + ' ' + x.num : x.base; });
  itens.forEach(function(x){ if (x.dup) x.nome = x.base; x.marca = !x.dup && x.ac === true; });

}

  if (el.getAttribute && el.getAttribute('data-id') && el.getAttribute('data-f')) { var id = el.getAttribute('data-id'), f = el.getAttribute('data-f'); S.edits[id] = S.edits[id] || {}; S.edits[id][f] = el.value; return; }
  if (!S.amb || S.tela !== 'ambiente') return;
  if (el.id === 'amb_base') { S.baseAmb = el.value; $('box_outro').hidden = S.baseAmb !== '__outro__'; if (S.baseAmb !== '__outro__') S.outro = ''; sugereCompl(); S.amb.nome = nomeFinal(); agendaPrev(600); return; }
  if (el.id === 'amb_compl') { S.compl = el.value.trim(); S.amb.nome = nomeFinal(); return; }
  if (el.id === 'amb_outro') { S.outro = el.value; S.amb.nome = nomeFinal(); return; }
  if (el.id === 'teto_modo') { var m = el.value; if (m === '') S.amb.teto = []; else if (m === 'misto') { var ant = S.amb.teto.length === 1 ? S.amb.teto[0].t : 'laje_iso'; S.amb.teto = [{ t: ant, a: S.amb.piso || 0 }, { t: 'laje_exp', a: 0 }]; } else S.amb.teto = [{ t: m }]; $('box_teto').innerHTML = htmlTeto(S.amb); agendaPrev(300); return; }
  var k = el.getAttribute && el.getAttribute('data-k');
  if (!k) return;
  var v = el.value, t = el.getAttribute('data-t');
  if (t === 'n') v = (el.tagName === 'SELECT' && v === '') ? '' : (v === '' && el.tagName !== 'SELECT' ? 0 : pn(v));
  if (k === 'tubPlanta' || /M$/.test(k)) v = el.value === '' ? '' : pn(el.value);
  if (k === 'acAnalisado') { v = acNorm(el.value); if (el.value.trim() !== '' && v === '') toast('Informe o AC como número ou número com letra, ex.: 4 ou 4a.', true); }
  setPath(S.amb, k, v);
  if (t === 'ap') { var p = S.aparelhos.filter(function(x){ return x.nome === v; })[0]; var i = +k.split('.')[1]; if (p) { S.amb.aparelhos[i].w = p.w; if (!S.amb.aparelhos[i].q) S.amb.aparelhos[i].q = 1; $('box_ap').innerHTML = htmlAparelhos(S.amb); } }
  var m2 = k.match(/^ilum\.(\d+)\./); if (m2) { var x = S.amb.ilum[+m2[1]], sub = $('il_sub_' + m2[1]); if (sub) sub.value = fmt(pn(x.l) * pn(x.n) * pn(x.w), 2); }
  atualizaTotais(); agendaPrev(600);
}
function addTeto(){ S.amb.teto.push({ t: 'laje_iso', a: 0 }); $('box_teto').innerHTML = htmlTeto(S.amb); agendaPrev(300); }
function delTeto(i){ S.amb.teto.splice(i, 1); $('box_teto').innerHTML = htmlTeto(S.amb); agendaPrev(300); }
function addAp(){ S.amb.aparelhos.push({ nome: '', q: 1, w: 0 }); $('box_ap').innerHTML = htmlAparelhos(S.amb); atualizaTotais(); }
function delAp(i){ S.amb.aparelhos.splice(i, 1); $('box_ap').innerHTML = htmlAparelhos(S.amb); atualizaTotais(); agendaPrev(300); }
function addIl(){ S.amb.ilum.push({ l: 0, n: 0, w: 0 }); $('box_il').innerHTML = htmlIlum(S.amb); atualizaTotais(); }
function delIl(i){ S.amb.ilum.splice(i, 1); $('box_il').innerHTML = htmlIlum(S.amb); atualizaTotais(); agendaPrev(300); }
function formAparelho(){
  modal('<h3>Cadastrar aparelho</h3><div class="grid" style="margin-bottom:10px"><div class="campo c2"><label>Nome do aparelho</label><input id="ap_nome" placeholder="Ex.: Computador"></div><div class="campo"><label>Potência (W)</label><input id="ap_w" data-dec="2" inputmode="decimal"></div></div><div class="dica">O aparelho fica disponível na lista para todas as obras.</div><div class="barra" style="margin:14px 0 0"><div class="esp"></div><button class="acao secundaria" onclick="fechaModal()">Cancelar</button><button class="acao" onclick="salvaAparelho()">Cadastrar</button></div>');
}
async function salvaAparelho(){
  var r = await chamar('cadastrarAparelho', { nome: $('ap_nome').value, w: pn($('ap_w').value) });
  S.aparelhos = r.aparelhos; fechaModal(); toast('Aparelho cadastrado.'); $('box_ap').innerHTML = htmlAparelhos(S.amb); atualizaTotais();
}
function agendaPrev(ms){
  clearTimeout(tmrPrev); var meu = ++S.seq;
  tmrPrev = setTimeout(function(){
    if (!S.amb) return;
    S.amb.nome = nomeFinal() || S.amb.nome;
    api('calcularPrevia', S.obra.id, S.amb).then(function(r){ if (meu === S.seq && $('prev')) pintaPrev(r.c); }, function(e){ if ($('prev')) $('prev').innerHTML = '<span style="color:var(--er)">' + esc(e.message) + '</span>'; });
  }, ms);
}
function pintaPrev(c){
  var h = '<h3>Resultado</h3><div class="big">' + fmt(c.btu, 0) + ' <span style="font-size:14px">BTU/h</span></div><div class="dica">' + fmt(c.kcal, 0) + ' kcal/h · ' + fmt(c.kw, 2) + ' kW · ' + fmt(c.tr, 2) + ' TR</div>' +
    '<div style="margin:10px 0"><b>Aparelho sugerido:</b> ' + (c.sug ? fmt(c.sug, 0) + ' BTU' : (c.acima ? '<span class="tag">acima do maior aparelho cadastrado</span>' : '—')) + '</div>';
  if (c.alerta) h += '<div class="tag" style="margin-bottom:8px">⚠ O previsto em projeto é menor que o calculado</div>';
  if (c.reduz) h += '<label class="tag rd" style="display:flex;gap:6px;align-items:center;margin-bottom:8px;cursor:pointer"><input type="checkbox" ' + (S.amb && S.amb.reducao ? 'checked ' : '') + 'onchange="S.amb.reducao = this.checked"> Confirmar redução: previsto ' + fmt(S.amb ? pn(S.amb.previsto) : 0, 0) + ' → sugerido ' + fmt(c.sug, 0) + ' BTU</label>';
  if (c.tetoDif) h += '<div class="tag" style="margin-bottom:8px">⚠ A soma das áreas de teto difere do piso em ' + fmt(c.tetoDif, 2) + ' m²</div>';
  h += '<table>' + c.itens.map(function(i){ return '<tr><td>' + i.n + ' · ' + esc(i.t) + '</td><td>' + fmt(i.btu, 0) + '</td></tr>'; }).join('') +
    '<tr><td><b>9 · Subtotal</b></td><td><b>' + fmt(c.subBtu, 0) + '</b></td></tr><tr><td>10 · Fator geográfico</td><td>' + fmt(c.fatGeo, 2) + '</td></tr></table>' +
    '<div class="dica" style="margin-top:8px">Aparelhos: ' + fmt(c.eletrW, 0) + ' W · Iluminação: ' + fmt(c.ilumW, 0) + ' W<br>Tubulação: ' + (c.dimTotal == null ? '<b>pendente</b>' : 'total ' + fmt(c.dimTotal, 2) + ' m · com margem ' + fmt(c.dimMais, 2) + ' m') + ' (trecho vertical da obra: ' + fmt(c.trechoV, 2) + ' m)<br>Carga: ' + (c.w == null ? 'sem W cadastrado' : fmt(c.w, 0) + ' W') + '</div>' +
    (c.pend.length ? '<div class="tag" style="margin-top:8px">Pendente: ' + esc(c.pend.join(', ')) + '</div>' : '<div class="tag ok" style="margin-top:8px">Ambiente completo</div>');
  $('prev').innerHTML = h;
  var pa = c.parAreas || {}, ps = { pa_sul: pa.sul, pa_outra: pa.outra, pa_int: pa.int };
  Object.keys(ps).forEach(function(id){ var el = $(id); if (el) el.textContent = pa.porComprimento ? 'Área: ' + fmt(ps[id], 2) + ' m²' : ''; });
  var pb = $('prevbar'); if (pb && S.tela === 'ambiente') { pb.hidden = false; pb.innerHTML = '<b>' + fmt(c.btu, 0) + ' BTU/h</b> · sugerido: ' + (c.sug ? fmt(c.sug, 0) + ' BTU' : '—'); }
  var ts = $('teto_soma'); if (ts) ts.textContent = c.tetoDif ? 'A soma das áreas difere do piso em ' + fmt(c.tetoDif, 2) + ' m².' : 'A soma das áreas confere com o piso.';
}
async function salvaAmb(){
  S.amb.nome = nomeFinal();
  if (!S.amb.nome) return toast('Selecione ou informe o ambiente.', true);
  S.amb.aparelhos = S.amb.aparelhos.filter(function(x){ return x.nome || pn(x.w) > 0; });
  S.amb.ilum = S.amb.ilum.filter(function(x){ return pn(x.l) > 0 || pn(x.n) > 0 || pn(x.w) > 0; });
  if (S.baseAmb === '__outro__') { try { await chamar('cadastrarAmbienteNovo', $('amb_outro').value); } catch (e) { return; } }
  await chamar('salvarAmbiente', S.obra.id, S.amb); toast('Ambiente salvo.'); abrirObra(S.obra.id, 'ambientes');
}

/* ---------- PARÂMETROS ---------- */
async function irParams(){
  S.tela = 'params'; $('prevbar').hidden = true;
  var r = await chamar('obterParametros'); S.params = r;
  var grupos = {}, ordem = [];
  r.coef.forEach(function(c){ if (!grupos[c.grupo]) { grupos[c.grupo] = []; ordem.push(c.grupo); } grupos[c.grupo].push(c); });
  var h = '<div class="barra"><div><h2>Parâmetros</h2><div class="sub">Coeficientes de cálculo e aparelhos de ar-condicionado disponíveis. Valem para todas as obras. Alterações levam até 5 minutos para refletir em quem já está usando.</div></div><div class="esp"></div><button class="acao" onclick="salvaParams()">Salvar parâmetros</button></div>';
  h += '<div class="card"><h3>Aparelhos de ar-condicionado (BTU) e potência elétrica (W)</h3><div class="tw"><table class="tbl resp" id="teq"><tr><th>BTU</th><th>Potência (W)</th><th>Usar na sugestão</th><th></th></tr>' +
    r.equip.map(eqLinha).join('') + '</table></div><div style="margin-top:8px"><button class="acao sm" onclick="addEq()">+ Adicionar aparelho</button></div><div class="dica">Aparelhos sem potência (W) aparecem como "sem W" no resumo.</div></div>';
  ordem.forEach(function(g){
    h += '<div class="card"><h3>' + esc(g) + '</h3><div class="tw"><table class="tbl"><tr><th style="text-align:left">Coeficiente</th><th style="width:130px">Valor</th></tr>' +
      grupos[g].map(function(c){ return '<tr><td>' + esc(c.desc) + '</td><td><input class="pc" data-ch="' + esc(c.chave) + '" value="' + nv(c.valor) + '" style="text-align:right"></td></tr>'; }).join('') + '</table></div></div>';
  });
  $('main').innerHTML = h;
}
function eqLinha(e){ return '<tr><td data-l="BTU"><input class="eb" value="' + nv(e.btu) + '" style="text-align:right"></td><td data-l="Potência (W)"><input class="ew" value="' + nv(e.w) + '" style="text-align:right"></td><td class="c" data-l="Usar na sugestão"><input type="checkbox" class="ea"' + (e.ativo ? ' checked' : '') + '></td><td class="c acoes"><button class="acao sm perigo" onclick="this.closest(\'tr\').remove()">Remover</button></td></tr>'; }
function addEq(){ $('teq').insertAdjacentHTML('beforeend', eqLinha({ btu: '', w: '', ativo: true })); }
async function salvaParams(){
  var coef = [].map.call(document.querySelectorAll('.pc'), function(i){ return { chave: i.getAttribute('data-ch'), valor: pn(i.value) }; });
  var equip = [].map.call(document.querySelectorAll('#teq tr'), function(tr){ var b = tr.querySelector('.eb'); if (!b) return null; return { btu: pn(b.value), w: tr.querySelector('.ew').value === '' ? '' : pn(tr.querySelector('.ew').value), ativo: tr.querySelector('.ea').checked }; }).filter(function(x){ return x && x.btu > 0; });
  await chamar('salvarParametros', { coef: coef, equip: equip });
  var e = await api('listarEquipamentos'); S.equip = e.equip; toast('Parâmetros salvos.'); irParams();
}
</script>
</body>
